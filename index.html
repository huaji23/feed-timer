<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1115">
<title>喂奶计时</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0F1115; --card:#171A21; --card2:#1E222B; --line:#262B36;
  --tx:#E9ECF3; --mut:#868DA0; --acc:#F0A868; --acc2:#6BA8F5; --ok:#5FD08A; --warn:#E86A6A;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  overscroll-behavior-y:none}
body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}

#app{max-width:520px;margin:0 auto}

/* ---------- 顶栏 ---------- */
.top{padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 8px;display:flex;align-items:center;gap:10px}
.baby{flex:1;min-width:0}
.baby h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baby .sub{margin-top:3px;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;
  font-size:17px;flex:none;border:1px solid var(--line)}

/* ---------- 模式切换 ---------- */
.seg{display:flex;gap:6px;padding:6px 20px 0}
.seg button{flex:1;padding:9px 0;border-radius:11px;background:var(--card);color:var(--mut);
  font-size:14px;border:1px solid var(--line);transition:.15s}
.seg button.on{background:var(--card2);color:var(--tx);border-color:var(--acc)}
.seg button.on[data-m="pump"]{border-color:var(--acc2)}
.seg button.on[data-m="bottle"]{border-color:var(--ok)}

/* ---------- 计时主体 ---------- */
.stage{padding:20px 20px 8px;display:flex;flex-direction:column;align-items:center}
.timer{position:relative;width:min(72vw,290px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line);transition:.3s}
.timer.run .ring{border-color:var(--acc);box-shadow:0 0 0 8px rgba(240,168,104,.09),0 0 44px rgba(240,168,104,.2)}
.timer.paused .ring{border-color:var(--mut);box-shadow:none}
.tbtn{position:relative;width:100%;height:100%;border-radius:50%;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.18s}
.timer.run .tbtn{background:rgba(240,168,104,.1)}
.tbtn:active{transform:scale(.97)}
.tbtn .big{font-size:20px;font-weight:600;color:var(--mut)}
.tbtn .clock{font-size:52px;font-weight:250;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.timer.run .tbtn .clock{color:var(--acc);font-weight:200}
.tbtn .sub{font-size:13px;color:var(--mut);margin-top:2px}
.hint{font-size:12.5px;color:var(--mut);margin-top:16px;text-align:center;min-height:18px}
.hint.alarm{color:var(--acc)}

/* 左右侧 */
.sides{display:flex;gap:10px;width:min(72vw,290px);margin-bottom:14px}
.side{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.side .lbl{font-size:12px;color:var(--mut)}
.side .v{font-size:19px;font-weight:300;font-variant-numeric:tabular-nums;margin-top:2px}
.side.act{border-color:var(--acc);background:rgba(240,168,104,.08)}
.side.act .v{color:var(--acc)}
.side.urge{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,168,104,.45)}50%{box-shadow:0 0 0 8px rgba(240,168,104,0)}}

/* 小动作行 */
.acts{display:flex;gap:8px;width:min(72vw,290px);margin-top:16px}
.acts button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 4px;
  font-size:13px;color:var(--tx)}
.acts button:active{background:var(--card2)}

/* ---------- 列表 ---------- */
.sec{padding:18px 20px 0}
.sec h2{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-size:15px;font-variant-numeric:tabular-nums;flex:none;width:52px;color:var(--tx)}
.row .m{flex:1;min-width:0}
.row .m .a{font-size:14.5px}
.row .m .b{font-size:12px;color:var(--mut);margin-top:2px}
.row .d{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.daylabel{padding:14px 15px 6px;font-size:12px;color:var(--mut)}
.empty{padding:26px 15px;text-align:center;color:var(--mut);font-size:13.5px}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:0 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat .k{font-size:11.5px;color:var(--mut)}
.stat .v{font-size:23px;font-weight:300;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--mut);margin-left:2px;font-weight:400}
.bars{padding:14px 15px;display:flex;align-items:flex-end;gap:5px;height:112px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .bar{width:100%;background:rgba(240,168,104,.35);border-radius:5px 5px 2px 2px;min-height:3px}
.bars .bar.hi{background:var(--acc)}
.bars .lb{font-size:10px;color:var(--mut)}

/* ---------- 设置 ---------- */
.fld{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.fld:last-child{border-bottom:0}
.fld .k{flex:1;font-size:14.5px}
.fld .k small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.fld input[type=text],.fld input[type=number]{background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;width:132px;text-align:right;font-variant-numeric:tabular-nums}
.fld input.short{width:78px}
.btnrow{display:flex;gap:9px;padding:16px 20px}
.btnrow button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:14px}
.btnrow button.danger{color:var(--warn);border-color:#3a2a2a}

/* ---------- 底部导航 ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,17,21,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:50}
.nav button{flex:1;padding:11px 0 12px;font-size:10.5px;color:var(--mut)}
.nav button .ic{display:block;font-size:19px;margin-bottom:3px;line-height:1}
.nav button.on{color:var(--acc)}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
.sheet.on{display:flex}
.sheet .panel{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + var(--safe-b));animation:up .22s}
@keyframes up{from{transform:translateY(18px);opacity:.6}}
.sheet h3{margin:0 0 16px;font-size:17px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:15px}
.chips button.on{border-color:var(--acc);color:var(--acc)}
.sheet input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:14px;font-size:24px;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:14px}
.sheet .actions{display:flex;gap:9px;margin-top:16px}
.sheet .actions button{flex:1;padding:14px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-size:15px}
.sheet .actions button.pri{background:var(--acc);color:#1a1206;border-color:var(--acc);font-weight:600}
.view{display:none;padding-bottom:10px}
.view.on{display:block}
</style>
</head>
<body>
<div id="app">

  <div class="top">
    <div class="baby">
      <h1 id="babyName">宝宝</h1>
      <div class="sub" id="topSub">—</div>
    </div>
    <button class="icon-btn" onclick="go('settings')">⚙</button>
  </div>

  <!-- ===== 计时 ===== -->
  <div class="view on" id="v-timer">
    <div class="seg" id="modeSeg">
      <button data-m="breast" class="on">母乳</button>
      <button data-m="bottle">瓶喂</button>
      <button data-m="pump">吸奶</button>
    </div>

    <div class="stage">
      <div class="sides" id="sides" style="display:none">
        <button class="side" id="sideL" onclick="setSide('L')">
          <div class="lbl">左侧</div><div class="v" id="lv">0:00</div>
        </button>
        <button class="side" id="sideR" onclick="setSide('R')">
          <div class="lbl">右侧</div><div class="v" id="rv">0:00</div>
        </button>
      </div>

      <div class="timer" id="timer">
        <div class="ring"></div>
        <button class="tbtn" id="mainBtn" onclick="toggleSession()">
          <div class="big" id="tBig">开始喂奶</div>
          <div class="clock" id="tClock" style="display:none">00:00</div>
          <div class="sub" id="tSub">点击一下开始</div>
        </button>
      </div>

      <div class="hint" id="hint"></div>

      <div class="acts">
        <button id="pauseBtn" onclick="togglePause()" style="display:none">暂停</button>
        <button onclick="openDiaper()">💧 尿布</button>
        <button onclick="openWeight()">⚖️ 体重</button>
      </div>
    </div>

    <div class="sec">
      <h2>最近记录</h2>
      <div class="card" id="recent"></div>
    </div>
  </div>

  <!-- ===== 记录 ===== -->
  <div class="view" id="v-log">
    <div class="sec" style="padding-top:16px">
      <h2>全部记录</h2>
      <div class="card" id="logAll"></div>
    </div>
  </div>

  <!-- ===== 统计 ===== -->
  <div class="view" id="v-stats">
    <div class="sec" style="padding-top:16px">
      <h2>今日</h2>
      <div class="stats" id="statToday"></div>
    </div>
    <div class="sec">
      <h2>近 7 天喂奶时长</h2>
      <div class="card"><div class="bars" id="bars7"></div></div>
    </div>
    <div class="sec">
      <h2>近 7 天次数</h2>
      <div class="card"><div class="bars" id="barsN"></div></div>
    </div>
    <div class="sec">
      <h2>尿布与体重</h2>
      <div class="stats" id="statExtra"></div>
    </div>
  </div>

  <!-- ===== 设置 ===== -->
  <div class="view" id="v-settings">
    <div class="sec" style="padding-top:16px">
      <div class="card">
        <div class="fld">
          <div class="k">宝宝名字<small>显示在标题</small></div>
          <input type="text" id="setName" onchange="save()">
        </div>
        <div class="fld">
          <div class="k">超时提醒间隔<small>超过这么久没喂就提醒</small></div>
          <input type="number" class="short" id="setGap" onchange="save()"><span style="color:var(--mut)">分钟</span>
        </div>
        <div class="fld">
          <div class="k">夜间免打扰<small>这个时段内不主动提醒</small></div>
          <input type="number" class="short" id="setQ1" onchange="save()">—<input type="number" class="short" id="setQ2" onchange="save()">
        </div>
        <div class="fld">
          <div class="k">换边提醒阈值<small>单侧喂够这么久提醒换边</small></div>
          <input type="number" class="short" id="setSide" onchange="save()"><span style="color:var(--mut)">分钟</span>
        </div>
        <div class="fld">
          <div class="k">通知权限<small>超时提醒需要系统通知</small></div>
          <button class="icon-btn" onclick="askNotify()" id="notifyBtn">开启</button>
        </div>
      </div>
      <div class="btnrow">
        <button onclick="exportCSV()">导出 CSV</button>
        <button onclick="exportJSON()">备份 JSON</button>
      </div>
      <div class="btnrow">
        <button onclick="importJSON()">恢复备份</button>
        <button class="danger" onclick="clearAll()">清空全部数据</button>
      </div>
      <input type="file" id="fileIn" accept=".json" style="display:none" onchange="doImport(this)">
    </div>
  </div>

  <div class="nav">
    <button class="on" data-v="timer" onclick="go('timer')"><span class="ic">⏱</span>计时</button>
    <button data-v="log" onclick="go('log')"><span class="ic">📋</span>记录</button>
    <button data-v="stats" onclick="go('stats')"><span class="ic">📊</span>统计</button>
    <button data-v="settings" onclick="go('settings')"><span class="ic">⚙</span>设置</button>
  </div>
</div>

<!-- 弹层 -->
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ================= 数据 ================= */
const KEY='feedtimer.v1';
let D = load();
function load(){
  try{ return Object.assign({feeds:[],diapers:[],weights:[],settings:{}}, JSON.parse(localStorage.getItem(KEY)||'{}')); }
  catch(e){ return {feeds:[],diapers:[],weights:[],settings:{}}; }
}
const S = D.settings;
const set=(k,v)=>{ S[k]=v; save(); };
function save(){ localStorage.setItem(KEY, JSON.stringify(D)); }

/* ================= 状态 ================= */
let sess = JSON.parse(localStorage.getItem('feedtimer.sess')||'null'); // {mode,start,acc,paused,pauseT,side,sides,ml}
function saveSess(){ sess?localStorage.setItem('feedtimer.sess',JSON.stringify(sess)):localStorage.removeItem('feedtimer.sess'); }
let mode='breast', curSide='L', lastNotified=0;

/* ================= 工具 ================= */
const pad=n=>String(n).padStart(2,'0');
const hhmmss=sec=>{sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`};
const hhmm=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  return h?`${h}小时${pad(m)}分`:`${m}分钟`};
const clock=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayKey=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function buzz(ms){ try{navigator.vibrate&&navigator.vibrate(ms||12)}catch(e){} }
function today(){ const s=new Date();s.setHours(0,0,0,0);return s.getTime(); }
function dayStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}

/* ================= 计时核心 ================= */
function toggleSession(){
  if(!sess){ startSession(); }
  else if(sess.paused){ resumeSession(); }
  else { endSession(); }
}
function startSession(){
  const ml = mode==='pump'||mode==='bottle' ? Number(document.getElementById('mlInput')?.value||0) : 0;
  sess={mode,start:Date.now(),acc:0,paused:false,side:curSide||'L',sides:{L:0,R:0},ml:ml||0};
  saveSess(); buzz(18); render();
}
function togglePause(){
  if(!sess) return;
  if(!sess.paused){ accrue(); sess.paused=true; }
  else { sess.paused=false; sess.start=Date.now(); }
  saveSess(); buzz(10); render();
}
function resumeSession(){ sess.paused=false; sess.start=Date.now(); saveSess(); buzz(10); render(); }
function endSession(){
  if(!sess) return;
  accrue();
  const total = sess.acc;                 // 毫秒，已结算完毕
  const rec={id:uid(),ts:sess.start,dur:Math.round(total/1000),mode:sess.mode};
  if(sess.mode==='breast'){ rec.L=sess.sides.L; rec.R=sess.sides.R; }  // 毫秒
  if(sess.mode==='pump'||sess.mode==='bottle') rec.ml=sess.ml||0;
  if(rec.dur>=1 || rec.ml){ D.feeds.unshift(rec); }
  sess=null; saveSess(); buzz(24); render(); save();
}
function setSide(s){
  if(!sess){ curSide=s; render(); return; }        // 未开始：预选起始侧
  if(sess.mode==='breast'){ accrue(); sess.side=s; saveSess(); buzz(8); render(); }
}

/* 把流逝的时间结算进 acc + 当前侧。
   acc 是「已结算毫秒」，sides 是左右侧各自的已结算毫秒。
   每秒调一次 + 切边/暂停/结束时调一次，保证永不丢时长。 */
function accrue(){
  if(!sess||sess.paused) return;
  const el = Date.now() - sess.start;
  if(el>0){ sess.acc += el; sess.sides[sess.side] += el; }
  sess.start = Date.now();
}
/* elapsedSec / sideSec 必须「实时按时间戳算」，不能只读累加值。
   原因：手机切到后台（微信等）时 iOS 会冻结 JS 定时器，
   若靠 setInterval 累加，冻结期间的时长就丢了。
   现在：acc 是「已结算毫秒」，start 是「上次结算时刻」，
   两者相减即实时经过时间 —— 定时器恢复后 accrue 一次即可全部补回。 */
function elapsedSec(){
  if(!sess) return 0;
  if(sess.paused) return sess.acc/1000;
  return (sess.acc + (Date.now()-sess.start))/1000;
}
function sideSec(){
  if(!sess) return {L:0,R:0};
  const s={L:sess.sides.L,R:sess.sides.R};
  if(!sess.paused){ const el=Date.now()-sess.start; if(el>0) s[sess.side]+=el; }
  return s;
}

/* ================= 渲染 ================= */
function render(){
  // 顶栏
  document.getElementById('babyName').textContent = S.name||'宝宝';
  const last = D.feeds[0];
  const tf = D.feeds.filter(f=>f.ts>=today());
  const tfDur = tf.reduce((a,b)=>a+(b.dur||0),0);
  document.getElementById('topSub').textContent =
    (last? `距上次 ${hhmm((Date.now()-last.ts)/1000)} · `:'') + `今日 ${tf.length} 次 / ${hhmm(tfDur)}`;

  // 模式段
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));

  // 主体
  const t=document.getElementById('timer'), big=document.getElementById('tBig'),
        cl=document.getElementById('tClock'), sub=document.getElementById('tSub'),
        hint=document.getElementById('hint');
  const sidesEl=document.getElementById('sides');
  t.classList.remove('run','paused');

  if(sess){
    const el=elapsedSec();
    cl.style.display='block'; big.style.display='none';
    cl.textContent=hhmmss(el);
    if(sess.paused){ t.classList.add('paused'); sub.textContent='已暂停 · 点击继续'; }
    else { t.classList.add('run'); sub.textContent='点击结束'; }
    document.getElementById('pauseBtn').style.display='';
    document.getElementById('pauseBtn').textContent = sess.paused?'继续':'暂停';

    if(mode==='breast'){
      sidesEl.style.display='flex';
      const s=sideSec();
      document.getElementById('lv').textContent=hhmmss(s.L/1000);
      document.getElementById('rv').textContent=hhmmss(s.R/1000);
      document.getElementById('sideL').classList.toggle('act',sess.side==='L');
      document.getElementById('sideR').classList.toggle('act',sess.side==='R');
      const lim=(S.sideMin||12)*60*1000;   // 毫秒
      const urge = sess.side==='L'? s.R>=lim : s.L>=lim;
      document.getElementById('sideL').classList.toggle('urge',urge&&sess.side==='R');
      document.getElementById('sideR').classList.toggle('urge',urge&&sess.side==='L');
      const cur=sess.side==='L'?s.L:s.R;
      hint.textContent = urge? '该换边了' : (cur>=lim? '可以换边了':'');
      hint.classList.toggle('alarm',!!urge);
    } else { sidesEl.style.display='none'; hint.textContent=''; hint.classList.remove('alarm'); }
  } else {
    cl.style.display='none'; big.style.display='block';
    big.textContent = mode==='breast'?'开始亲喂' : mode==='bottle'?'开始瓶喂':'开始吸奶';
    sub.textContent = '点击一下开始';
    document.getElementById('pauseBtn').style.display='none';
    // 母乳模式下即使没开始，也显示左右侧（可预选起始侧）
    if(mode==='breast'){
      sidesEl.style.display='flex';
      document.getElementById('lv').textContent='0:00';
      document.getElementById('rv').textContent='0:00';
      document.getElementById('sideL').classList.toggle('act',curSide==='L');
      document.getElementById('sideR').classList.toggle('act',curSide==='R');
      document.getElementById('sideL').classList.remove('urge');
      document.getElementById('sideR').classList.remove('urge');
    } else { sidesEl.style.display='none'; }
    hint.textContent=''; hint.classList.remove('alarm');
  }

  // ml 输入（瓶喂/吸奶）
  let mlBox=document.getElementById('mlBox');
  if(mode!=='breast'){
    if(!mlBox){
      mlBox=document.createElement('div');
      mlBox.id='mlBox'; mlBox.className='acts'; mlBox.style.marginTop='14px';
      mlBox.innerHTML='<div style="flex:1;display:flex;gap:6px;justify-content:center">'+
        [60,90,120,150,180].map(v=>`<button class="mlc" onclick="pickMl(${v},this)">${v}</button>`).join('')+
        '</div>';
      document.querySelector('.stage').insertBefore(mlBox, document.querySelector('.acts'));
    }
    mlBox.style.display='';
    if(!mlBox.querySelector('input')){
      const inp=document.createElement('input');
      inp.type='number'; inp.id='mlInput'; inp.placeholder='毫升';
      inp.style.cssText='width:88px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center;font-size:16px';
      inp.oninput=()=>{ mlBox.querySelectorAll('.mlc').forEach(b=>b.classList.remove('on')); };
      mlBox.querySelector('div').appendChild(inp);
    }
  } else if(mlBox){ mlBox.style.display='none'; }

  renderRecent(); renderLog(); renderStats();
}
function pickMl(v,el){ document.getElementById('mlInput').value=v; mlBox.querySelectorAll('.mlc').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }

function feedDesc(f){
  if(f.mode==='breast'){
    const L=Math.round((f.L||0)/60000), R=Math.round((f.R||0)/60000);  // 毫秒 → 分钟
    const dur=Math.round((f.dur||0)/60);
    return {a:'母乳亲喂', b:`左 ${L}分 · 右 ${R}分 · 共 ${dur}分`};
  }
  if(f.mode==='pump') return {a:'吸奶', b:(f.ml?f.ml+' 毫升':'')};
  return {a:'瓶喂', b:(f.ml?f.ml+' 毫升':'')};
}
function renderRecent(){
  const box=document.getElementById('recent'); const list=D.feeds.slice(0,4);
  box.innerHTML = list.length? list.map(f=>{
    const d=feedDesc(f);
    return `<div class="row" onclick="delFeed('${f.id}')">
      <div class="t">${clock(f.ts)}</div>
      <div class="m"><div class="a">${d.a}</div><div class="b">${d.b||''}</div></div>
      <div class="d">${hhmmss(f.dur||0)}</div></div>`;
  }).join('') : `<div class="empty">还没有记录 · 点上面大圆开始</div>`;
}
function renderLog(){
  const box=document.getElementById('logAll');
  if(!D.feeds.length && !D.diapers.length){ box.innerHTML='<div class="empty">暂无记录</div>'; return; }
  const groups={};
  D.feeds.forEach(f=>{ (groups[dayKey(f.ts)]=groups[dayKey(f.ts)]||[]).push(f); });
  const days=Object.keys(groups).sort().reverse();
  let html='';
  days.forEach(k=>{
    const fs=groups[k];
    const tot=fs.reduce((a,b)=>a+(b.dur||0),0);
    html+=`<div class="daylabel">${k} · 共 ${fs.length} 次 / ${hhmm(tot)}</div>`;
    html+=fs.map((f,i)=>{
      const d=feedDesc(f); const prev=groups[k][i+1];
      const gap=prev? hhmm((f.ts-prev.ts)/1000):'';
      return `<div class="row" onclick="delFeed('${f.id}')">
        <div class="t">${clock(f.ts)}</div>
        <div class="m"><div class="a">${d.a}</div><div class="b">${d.b||''}${gap?' · 距上次 '+gap:''}</div></div>
        <div class="d">${hhmmss(f.dur||0)}</div></div>`;
    }).join('');
  });
  box.innerHTML=html;
}
function renderStats(){
  const tf=D.feeds.filter(f=>f.ts>=today());
  const dur=tf.reduce((a,b)=>a+(b.dur||0),0);
  const gaps=[]; for(let i=0;i<tf.length-1;i++) gaps.push((tf[i].ts-tf[i+1].ts)/3600000);
  const avgGap = gaps.length? gaps.reduce((a,b)=>a+b,0)/gaps.length : 0;
  const td=D.diapers.filter(d=>d.ts>=today());
  const pee=td.filter(d=>d.type!=='poop').length, poo=td.filter(d=>d.type==='poop').length;
  const ml=D.feeds.filter(f=>f.ts>=today()&&f.ml).reduce((a,b)=>a+b.ml,0);
  const lastW=D.weights[0];
  document.getElementById('statToday').innerHTML=[
    ['喂奶次数',tf.length,'次'],['喂奶总时长',Math.round(dur/60),'分'],
    ['平均间隔',avgGap?avgGap.toFixed(1):'—','小时'],['距上次喂',D.feeds[0]?Math.round((Date.now()-D.feeds[0].ts)/60000):'—','分']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');
  document.getElementById('statExtra').innerHTML=[
    ['尿布',pee,'次'],['大便',poo,'次'],
    ['今日奶量',ml,'ml'],['最新体重',lastW?lastW.kg:'—',lastW?'kg':'']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  // 7 天柱状
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d.getTime()); }
  const durs=days.map(d0=>D.feeds.filter(f=>f.ts>=d0&&f.ts<d0+86400000).reduce((a,b)=>a+(b.dur||0),0));
  const cnts=days.map(d0=>D.feeds.filter(f=>f.ts>=d0&&f.ts<d0+86400000).length);
  const mxD=Math.max(...durs,1), mxC=Math.max(...cnts,1);
  const lb=d=>{const x=new Date(d);return `${x.getMonth()+1}/${x.getDate()}`};
  document.getElementById('bars7').innerHTML=days.map((d,i)=>
    `<div class="b"><div class="bar ${durs[i]===mxD&&mxD>0?'hi':''}" style="height:${Math.round(durs[i]/mxD*82)}px"></div><div class="lb">${lb(d)}</div></div>`).join('');
  document.getElementById('barsN').innerHTML=days.map((d,i)=>
    `<div class="b"><div class="bar ${cnts[i]===mxC&&mxC>0?'hi':''}" style="height:${Math.round(cnts[i]/mxC*82)}px"></div><div class="lb">${lb(d)}</div></div>`).join('');
}

/* ================= 交互 ================= */
function go(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('on',e.dataset.v===v));
  if(v==='settings') fillSettings();
  window.scrollTo(0,0);
}
function delFeed(id){
  if(!confirm('删除这条记录？')) return;
  D.feeds=D.feeds.filter(f=>f.id!==id); save(); render();
}
function openSheet(html){ document.getElementById('panel').innerHTML=html; document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
function openDiaper(){
  openSheet(`<h3>尿布记录</h3>
    <div class="chips">
      <button onclick="addDiaper('pee')">💧 尿了</button>
      <button onclick="addDiaper('poop')">💩 大便</button>
      <button onclick="addDiaper('both')">💧💩 都有</button>
    </div>
    <div class="actions"><button onclick="closeSheet()">取消</button></div>`);
}
function addDiaper(t){
  D.diapers.unshift({id:uid(),ts:Date.now(),type:t}); save(); closeSheet(); buzz(14); render();
}
function openWeight(){
  openSheet(`<h3>记录体重</h3>
    <input type="number" id="wIn" step="0.01" placeholder="公斤">
    <div class="actions"><button onclick="closeSheet()">取消</button><button class="pri" onclick="addWeight()">保存</button></div>`);
  setTimeout(()=>document.getElementById('wIn')?.focus(),60);
}
function addWeight(){
  const kg=Number(document.getElementById('wIn').value);
  if(!kg) return;
  D.weights.unshift({id:uid(),ts:Date.now(),kg}); save(); closeSheet(); buzz(14); render();
}
function fillSettings(){
  document.getElementById('setName').value=S.name||'';
  document.getElementById('setGap').value=S.gapMin||180;
  document.getElementById('setQ1').value=S.q1??22;
  document.getElementById('setQ2').value=S.q2??6;
  document.getElementById('setSide').value=S.sideMin||12;
  document.getElementById('notifyBtn').textContent = Notification.permission==='granted'?'已开启':'开启';
}
function save(){ localStorage.setItem(KEY,JSON.stringify(D)); fillSettings(); }
function askNotify(){
  if(!('Notification' in window)){ alert('这个浏览器不支持通知'); return; }
  Notification.requestPermission().then(p=>{ fillSettings(); if(p==='granted') notify('喂奶计时','提醒已开启'); });
}
function notify(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  try{ new Notification(title,{body,icon:'icon-180.png',badge:'icon-180.png',tag:'feed'}); }catch(e){}
}
function exportCSV(){
  const rows=[['时间','类型','时长(分)','左(分)','右(分)','奶量(ml)']];
  D.feeds.slice().sort((a,b)=>a.ts-b.ts).forEach(f=>{
    rows.push([new Date(f.ts).toLocaleString('zh-CN'), feedDesc(f).a, Math.round((f.dur||0)/60),
      Math.round((f.L||0)/60), Math.round((f.R||0)/60), f.ml||'']);
  });
  rows.push([]); rows.push(['尿布时间','类型']);
  D.diapers.slice().sort((a,b)=>a.ts-b.ts).forEach(d=>rows.push([new Date(d.ts).toLocaleString('zh-CN'), d.type==='poop'?'大便':d.type==='both'?'尿+便':'尿']));
  rows.push([]); rows.push(['体重时间','kg']);
  D.weights.slice().sort((a,b)=>a.ts-b.ts).forEach(w=>rows.push([new Date(w.ts).toLocaleString('zh-CN'), w.kg]));
  const csv='\uFEFF'+rows.map(r=>r.map(x=>`"${x}"`).join(',')).join('\n');
  dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),'喂奶记录.csv');
}
function exportJSON(){ dl(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),'喂奶备份.json'); }
function dl(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJSON(){ document.getElementById('fileIn').click(); }
function doImport(el){
  const f=el.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result);
      if(confirm('恢复备份会覆盖当前数据，确定？')){ D=Object.assign({feeds:[],diapers:[],weights:[],settings:{}},o); save(); render(); alert('已恢复'); }
    }catch(e){ alert('文件读不了'); } };
  rd.readAsText(f);
}
function clearAll(){
  if(!confirm('确定清空所有记录？不可恢复')) return;
  D={feeds:[],diapers:[],weights:[],settings:S}; save(); render();
}

/* ================= 提醒 ================= */
setInterval(()=>{
  accrue();          // 每秒结算，保证时长精确不丢
  render();
  checkNotify();
},1000);

function checkNotify(){
  const gap=S.gapMin||180;
  if(!D.feeds.length) return;
  const since=(Date.now()-D.feeds[0].ts)/60000;
  if(since<gap) return;
  const h=new Date().getHours();
  const q1=S.q1??22, q2=S.q2??6;
  const quiet = q1>q2 ? (h>=q1||h<q2) : (h>=q1&&h<q2);
  if(quiet && since < gap*1.5) return;
  if(Date.now()-lastNotified<60000) return;
  lastNotified=Date.now();
  notify('该喂奶了', `已经 ${Math.round(since/60*10)/10} 小时没喂宝宝了`);
}

/* ================= 启动 ================= */
document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.onclick=()=>{ if(sess) return; mode=b.dataset.m; render(); };
});
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
/* 页面回到前台时刷新；并且任何点击都刷新 ——
   iOS 在后台会冻结 JS 定时器，靠定时器驱动会显示旧值。
   时长本身按时间戳实时算（elapsedSec），所以只要 render 跑一次就是准的。 */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ accrue(); render(); } });
window.addEventListener('focus',()=>{ accrue(); render(); });
window.addEventListener('pageshow',()=>{ accrue(); render(); });
document.addEventListener('pointerdown',()=>{ if(sess){ accrue(); render(); } }, {passive:true});
</script>
