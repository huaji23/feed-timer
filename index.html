<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1115">
<title>喂奶计时</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0F1115; --card:#171A21; --card2:#1E222B; --line:#262B36;
  --tx:#E9ECF3; --mut:#868DA0; --acc:#F0A868; --acc2:#6BA8F5; --ok:#5FD08A; --warn:#E86A6A;
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* 浅色主题 */
html[data-theme="light"]{
  --bg:#F5F6F8; --card:#FFFFFF; --card2:#EDEFF3; --line:#DFE3EA;
  --tx:#1A1D23; --mut:#6B7280; --acc:#D9813C; --acc2:#3B7FD4; --ok:#2E9E5B; --warn:#D34545;
}
/* 护眼主题 */
html[data-theme="eye"]{
  --bg:#1E2418; --card:#252C1F; --card2:#2C3426; --line:#39422F;
  --tx:#E4E8DC; --mut:#9AA38C; --acc:#C9A96A; --acc2:#7FB08A; --ok:#8FC97A; --warn:#D98B7A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  letter-spacing:.01em;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* 全局按压反馈：所有可点元素按下时缩一点点（140ms），让用户确信"点到了" */
button:active{transform:scale(.97);transition:transform 140ms cubic-bezier(.23,1,.32,1)}
input,select{font:inherit;color:inherit}

#app{max-width:520px;margin:0 auto}

/* ---------- 顶栏 ---------- */
.top{padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 8px;display:flex;align-items:center;gap:10px}
.baby{flex:1;min-width:0}
.baby h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baby .sub{margin-top:3px;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;
  font-size:17px;flex:none;border:1px solid var(--line)}

/* ---------- 模式切换 ---------- */
.seg{display:flex;gap:6px;padding:6px 20px 0}
.seg button{flex:1;padding:9px 0;border-radius:11px;background:var(--card);color:var(--mut);
  font-size:14px;border:1px solid var(--line);transition:.15s}
.seg button.on{background:var(--card2);color:var(--tx);border-color:var(--acc)}
.seg button.on[data-m="pump"]{border-color:var(--acc2)}
.seg button.on[data-m="bottle"]{border-color:var(--ok)}

/* ---------- 主题分段控件（滑块式，选中态绝对清晰） ---------- */
#themeSeg{
  position:relative;display:flex;gap:0;padding:5px;
  background:var(--card2);border:1px solid var(--line);border-radius:13px;
  width:100%;isolation:isolate;
}
#themeSeg button{
  position:relative;z-index:2;flex:1;padding:11px 0;border-radius:9px;
  background:transparent;border:0;font-size:14.5px;line-height:1;
  transition:color 200ms cubic-bezier(.23,1,.32,1),font-weight 200ms ease;
}
#themeSeg button.on{color:var(--acc)}
/* 滑块：跟随选中项移动 */
#themeSeg .seg-thumb{
  position:absolute;z-index:1;left:0;top:5px;
  background:var(--card);border:1px solid var(--acc);border-radius:9px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  transition:transform 260ms cubic-bezier(.23,1,.32,1),width 260ms cubic-bezier(.23,1,.32,1);
  pointer-events:none;
}

/* ---------- 计时主体 ---------- */
.stage{padding:20px 20px 8px;display:flex;flex-direction:column;align-items:center}
.timer{position:relative;width:min(72vw,290px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line);transition:.3s}
.timer.run .ring{border-color:var(--acc);box-shadow:0 0 0 8px rgba(240,168,104,.09),0 0 44px rgba(240,168,104,.2)}
.timer.paused .ring{border-color:var(--mut);box-shadow:none}
.tbtn{position:relative;width:100%;height:100%;border-radius:50%;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.18s}
.timer.run .tbtn{background:rgba(240,168,104,.1)}
.tbtn:active{transform:scale(.97)}
.tbtn .big{font-size:20px;font-weight:600;color:var(--mut)}
.tbtn .clock{font-size:52px;font-weight:250;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.timer.run .tbtn .clock{color:var(--acc);font-weight:200}
.tbtn .sub{font-size:13px;color:var(--mut);margin-top:2px}
.hint{font-size:12.5px;color:var(--mut);margin-top:16px;text-align:center;min-height:18px}
.hint.alarm{color:var(--acc)}

/* 左右侧 */
.sides{display:flex;gap:10px;width:min(72vw,290px);margin-bottom:14px}
.side{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.side .lbl{font-size:12px;color:var(--mut)}
.side .v{font-size:19px;font-weight:300;font-variant-numeric:tabular-nums;margin-top:2px}
.side.act{border-color:var(--acc);background:rgba(240,168,104,.08)}
.side.act .v{color:var(--acc)}
.side.urge{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,168,104,.45)}50%{box-shadow:0 0 0 8px rgba(240,168,104,0)}}

/* 小动作行 */
.acts{display:flex;gap:8px;width:min(72vw,290px);margin-top:16px}
.acts button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 4px;
  font-size:13px;color:var(--tx)}
.acts button:active{background:var(--card2)}

/* ---------- 列表 ---------- */
.sec{padding:18px 20px 0}
.sec h2{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row .t{font-size:15px;font-variant-numeric:tabular-nums;flex:none;width:54px;color:var(--tx);font-weight:500}
.row .m{flex:1;min-width:0}
.row .m .a{font-size:15px;line-height:1.45;font-weight:500}
.row .m .b{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.4}
.row .d{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none;font-weight:500}
.daylabel{padding:14px 15px 6px;font-size:12px;color:var(--mut)}
.empty{padding:26px 15px;text-align:center;color:var(--mut);font-size:13.5px}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:0 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat .k{font-size:11.5px;color:var(--mut)}
.stat .v{font-size:23px;font-weight:300;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--mut);margin-left:2px;font-weight:400}
.bars{padding:14px 15px;display:flex;align-items:flex-end;gap:5px;height:112px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .bar{width:100%;background:rgba(240,168,104,.35);border-radius:5px 5px 2px 2px;min-height:3px}
.bars .bar.hi{background:var(--acc)}
.bars .lb{font-size:10px;color:var(--mut)}

/* ---------- 设置 ---------- */
.fld{padding:16px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.fld:last-child{border-bottom:0}
.fld .k{flex:1;min-width:0;font-size:15.5px;line-height:1.45;font-weight:500}
.fld .k small{
  display:block;color:var(--mut);font-size:13px;line-height:1.5;
  margin-top:5px;font-weight:400;letter-spacing:.005em;
}
.fld input[type=text],.fld input[type=number]{background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;width:132px;text-align:right;font-variant-numeric:tabular-nums}
.fld input.short{width:78px}

/* 输入 + 确认按钮 */
.row-inline{display:flex;gap:8px;align-items:center;flex:1 1 190px;min-width:170px}
.row-inline input{flex:1 1 auto;min-width:96px;width:auto!important;text-align:left!important}
/* 名字行改成上下结构，避免挤压 */
.fld.stack{flex-direction:column;align-items:stretch;gap:10px;padding:16px 15px}
.fld.stack .k{flex:none}
.fld.stack .row-inline{width:100%;flex:0 0 auto}
.fld.stack .hint-line{text-align:left;margin-top:-2px}
.fld.stack input[type=text]{width:100%!important;text-align:left!important}
.mini-btn{
  background:var(--acc);color:#12161F;border:none;border-radius:11px;
  padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;
}
.mini-btn:active{opacity:.8}
.hint-line{font-size:11.5px;color:var(--ok);flex-basis:100%;text-align:right;min-height:0}
.hint-line.warn{color:var(--warn)}

/* 主题分段（设置页内） */
#themeSeg{padding:0;width:100%}
#themeSeg button{font-size:13px;padding:10px 0}

/* 环形图 */
.donut-wrap{display:flex;align-items:center;gap:18px;padding:14px 15px}
.donut{
  width:112px;height:112px;border-radius:56px;flex-shrink:0;position:relative;
  background:var(--card2);
}
.donut::after{
  content:'';position:absolute;inset:22px;border-radius:34px;background:var(--card);
}
.donut-center{
  position:absolute;inset:0;display:grid;place-items:center;z-index:2;
  font-size:17px;font-weight:600;color:var(--tx);text-align:center;line-height:1.1;
}
.donut-center>div{display:flex;flex-direction:column;align-items:center}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:9px}
.lg-row{display:flex;align-items:center;gap:8px;font-size:13px}
.lg-dot{width:9px;height:9px;border-radius:5px;flex-shrink:0}
.lg-name{flex:1;color:var(--mut)}
.lg-val{font-weight:600;font-variant-numeric:tabular-nums}

/* 左右侧条 */
.lr-bar{display:flex;height:26px;border-radius:13px;overflow:hidden;margin:14px 15px 10px;background:var(--card2)}
.lr-seg{display:grid;place-items:center;font-size:11.5px;color:#12161F;font-weight:600}
.lr-txt{padding:0 15px 14px;font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between}

/* 24 小时分布 */
.hours{display:flex;gap:2px;align-items:flex-end;height:86px;padding:14px 15px}
.hours .h{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.hours .hb{width:100%;background:rgba(107,168,245,.32);border-radius:3px 3px 1px 1px;min-height:2px}
.hours .hb.hi{background:var(--acc2)}
.hours .hl{font-size:8.5px;color:var(--mut);margin-top:4px}

/* 14 天趋势 */
.trend{display:flex;gap:3px;align-items:flex-end;height:76px;padding:14px 15px}
.trend .t{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.trend .tb{width:100%;border-radius:3px 3px 1px 1px;min-height:2px;background:rgba(240,168,104,.3)}
.trend .tb.hi{background:var(--acc)}
.trend .tl{font-size:8.5px;color:var(--mut);margin-top:4px;white-space:nowrap}

/* 统计小卡 */
.stats .stat{background:var(--card2);border-radius:13px;padding:12px 13px}
.stats .stat .k{font-size:11.5px;color:var(--mut)}
.stats .stat .v{font-size:22px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.stats .stat .v small{font-size:11px;font-weight:400;color:var(--mut);margin-left:3px}


/* 记录页头部 + 多选 */
.hdr-row{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px}
.hdr-row h2{padding:0;margin:0}
.mini-btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:7px 14px;font-size:13px}
.mini-btn.on{border-color:var(--acc);color:var(--acc)}

.selbar{
  position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));
  display:none;align-items:center;gap:8px;padding:10px 12px;z-index:260;
  background:var(--card2);border-top:1px solid var(--line);
}
.selbar.on{display:flex}
.selbar span{flex:1;font-size:13.5px;color:var(--tx);font-weight:600}
.selbar button{background:var(--card);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:8px 12px;font-size:13px;flex:none;white-space:nowrap}
.selbar .cnt{flex:none;font-size:13.5px;color:var(--tx);font-weight:600;padding-right:2px}
.selbar .acts{display:flex;gap:6px;flex:1;justify-content:flex-end}
.selbar .acts button{flex:none}
.selmore{
  position:fixed;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom,0px));
  display:none;flex-direction:column;gap:1px;z-index:261;
  background:var(--card2);border-top:1px solid var(--line);padding:6px;
}
.selmore.on{display:flex}
.selmore button{background:transparent;border:0;color:var(--tx);text-align:left;
  padding:13px 14px;font-size:14.5px;border-radius:9px}
.selmore button:active{background:var(--card)}
.selbar button.danger{border-color:var(--warn);color:var(--warn);font-weight:600}
.row.sel{background:rgba(240,168,104,.12);border-radius:10px}
.row .ck{width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:transparent;margin-right:2px}
.row.sel .ck{background:var(--acc);border-color:var(--acc);color:#1a1208}
body.selecting .nav{opacity:.35;pointer-events:none}
body.selecting #v-log{padding-bottom:150px}

/* 弹层成功/提示画面 */
.sheet-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:44px 24px 52px;text-align:center;animation:smPop .26s cubic-bezier(.2,1.4,.4,1)}
.sm-icon{font-size:52px;line-height:1;margin-bottom:12px}
.sm-title{font-size:19px;font-weight:700;color:var(--tx);margin-bottom:5px}
.sm-sub{font-size:14px;color:var(--mut)}
@keyframes smPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* 操作反馈条 */
.toast{
  position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;
  background:var(--card2);border:1px solid var(--acc);border-radius:14px;
  padding:14px 16px;z-index:300;
  box-shadow:0 8px 28px rgba(0,0,0,.45);
  transform:translateY(160%) scale(.94);opacity:0;pointer-events:none;
  transition:transform .28s cubic-bezier(.2,1.3,.4,1),opacity .2s ease,bottom .22s ease;
  box-shadow:0 10px 36px rgba(0,0,0,.55), 0 0 0 1px rgba(240,168,104,.25);
}
.toast.on{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
.toast span{flex:1;font-size:15.5px;color:var(--tx);line-height:1.4;font-weight:600}
.toast button{
  flex:none;background:transparent;border:1px solid var(--acc);color:var(--acc);
  border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;
}

/* 档案切换 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px}
.chips .chip{
  background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:13.5px;color:var(--mut);
}
.chips .chip.on{border-color:var(--acc);color:var(--acc)}
.swap{font-size:13px;color:var(--mut);font-weight:400;margin-left:2px}

.btnrow{display:flex;gap:9px;padding:16px 20px}
.btnrow button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:14px}
.btnrow button.danger{color:var(--warn);border-color:#3a2a2a}

/* ---------- 底部导航 ---------- */
/* 导航栏跟随主题（用语义变量，不再硬编码深色） */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:50}
.nav button{
  flex:1;padding:11px 0 13px;font-size:11.5px;color:var(--mut);font-weight:500;
  letter-spacing:.02em;min-height:52px;transition:color 160ms ease;
}
.nav button .ic{display:block;font-size:21px;margin-bottom:4px;line-height:1}
.nav button.on{color:var(--acc);font-weight:600}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
.sheet.on{display:flex}
.sheet .panel{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + var(--safe-b));animation:up .22s}
@keyframes up{from{transform:translateY(18px);opacity:.6}}
.sheet h3{margin:0 0 16px;font-size:17px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:15px}
.chips button.on{border-color:var(--acc);color:var(--acc)}
.sheet input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:14px;font-size:24px;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:14px}
/* 弹层底部：主按钮全宽 + 取消是小字链接（视觉层级明确，不会有"两个平级选项"的困惑） */
.sheet .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.sheet .actions button{
  width:100%;padding:15px;border-radius:14px;font-size:15.5px;font-weight:600;
  background:var(--card2);border:1px solid var(--line);color:var(--tx);
  transition:transform 140ms cubic-bezier(.23,1,.32,1),opacity 140ms ease;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.sheet .actions button:active{transform:scale(.97);opacity:.9}
/* 主按钮：实心橙，全宽，最突出 */
.sheet .actions button.pri{
  background:var(--acc);color:#1A1206;border-color:var(--acc);
  box-shadow:0 4px 16px rgba(240,168,104,.28);
}
/* 次要动作（取消）：降级成文字链，不跟主按钮抢注意力 */
.sheet .actions button.ghost{
  background:transparent;border:0;color:var(--mut);font-weight:500;font-size:14px;
  padding:11px;min-height:44px;
}
.sheet .actions button.ghost:active{background:var(--card2);transform:none}
.actions button.pri:disabled{background:var(--card2);color:var(--mut);border-color:var(--line);font-weight:400}
.sel-hint{
  text-align:center;font-size:13.5px;color:var(--mut);
  padding:10px 20px 0;min-height:38px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:color 160ms ease;
}
.sel-hint.on{
  color:var(--acc);font-weight:600;
  background:color-mix(in srgb, var(--acc) 12%, transparent);
  border-radius:11px;
  margin:12px 20px 0;padding:10px 14px;min-height:0;
}
.view{display:none;padding-bottom:10px}
.view.on{display:block}
</style>
</head>
<body>
<div id="app">

  <div class="top">
    <div class="baby" onclick="openBabySwitch()">
      <h1 id="babyName">宝宝 <span class="swap">⇄</span></h1>
      <div class="sub" id="topSub">—</div>
    </div>
    <button class="icon-btn" onclick="hardReload()" title="刷新">↻</button>
    <button class="icon-btn" onclick="go('settings')">⚙</button>
  </div>

  <!-- ===== 计时 ===== -->
  <div class="view on" id="v-timer">
    <div class="seg" id="modeSeg">
      <button data-m="breast" class="on">母乳</button>

<script>
/* ================= 数据 ================= */
/* 本地：localStorage（离线可用、快）
   云端：COS shared/babies.json（多人共享）
   按「宝宝档案名」分桶：{ "王奕珩": {feeds:[],diapers:[],weights:[],settings:{}} } */
const KEY='feedtimer.v1';
const APP_VER='v27';
const THEME_KEY='feedtimer.theme';   // 主题是「设备级」偏好，不跟宝宝档案走
const CLOUD_READ='https://wanghuaji-1253952710.cos.ap-guangzhou.myqcloud.com/shared/babies.json';
const CLOUD_PUT=atob('aHR0cHM6Ly93YW5naHVhamktMTI1Mzk1MjcxMC5jb3MuYXAtZ3Vhbmd6aG91Lm15cWNsb3VkLmNvbS9zaGFyZWQvYmFiaWVzLmpzb24/cS1zaWduLWFsZ29yaXRobT1zaGExJnEtYWs9QUtJREc2dGE0TlVPNmJ0enNYMUtRTGl0cmhMelFmcG5ZNlNrJnEtc2lnbi10aW1lPTE3OTQ5'+'NzQyNDglM0IyMTEwMzM0MzA4JnEta2V5LXRpbWU9MTc5NDk3NDI0OCUzQjIxMTAzMzQzMDgmcS1oZWFkZXItbGlzdD1jb250ZW50LXR5cGUlM0Job3N0JnEtdXJsLXBhcmFtLWxpc3Q9JnEtc2lnbmF0dXJlPWViNTliNDExZDFjNTBhOGVjY2Q5ZmRhOTMyNDU4MDk4YTJmOTFlMTI=');   // 预签名 PUT（10年有效，分段 base64 避免被 GitHub secret scanning 拦）;   // 预签名 PUT（部署时注入）
const CLOUD_KEY='feedtimer.cloud.v1';  // 本地记住用过的档案

let D = load();
function load(){
  try{
    const d=Object.assign({feeds:[],diapers:[],weights:[],settings:{},tombstones:{}}, JSON.parse(localStorage.getItem(KEY)||'{}'));
    if(!d.tombstones || typeof d.tombstones!=='object') d.tombstones={};
    return d;
  }
  catch(e){ return {feeds:[],diapers:[],weights:[],settings:{},tombstones:{}}; }
}
const S = D.settings;
const set=(k,v)=>{ S[k]=v; save(); };
function save(){ localStorage.setItem(KEY, JSON.stringify(D)); }

/* ================= 状态 ================= */
let sess = JSON.parse(localStorage.getItem('feedtimer.sess')||'null'); // {mode,start,acc,paused,pauseT,side,sides,ml}
function saveSess(){ sess?localStorage.setItem('feedtimer.sess',JSON.stringify(sess)):localStorage.removeItem('feedtimer.sess'); }
let mode='breast', curSide='L', lastNotified=0;

/* ================= 工具 ================= */
const pad=n=>String(n).padStart(2,'0');
const hhmmss=sec=>{sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`};
/* 时长格式：<1分钟显示秒，避免「0分钟」看着像没记 */
const hhmm=sec=>{
  sec=Math.max(0,Math.floor(sec||0));
  if(sec<60) return sec+'秒';
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s2=sec%60;
  if(h) return `${h}小时${pad(m)}分`;
  if(s2 && m<10) return `${m}分${s2}秒`;
  return `${m}分钟`;
};
const clock=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayKey=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* 体重单位：内部存 kg（保留历史数据兼容），界面显示「斤」= kg*2 */
const kgToJin = kg => Math.round(kg*2*10)/10;
const jinToKg = jin => Math.round(jin/2*100)/100;
function buzz(ms){ try{navigator.vibrate&&navigator.vibrate(ms||12)}catch(e){} }
function today(){ const s=new Date();s.setHours(0,0,0,0);return s.getTime(); }
function dayStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}

/* ================= 计时核心 ================= */
function toggleSession(){
  if(!sess){ startSession(); }
  else if(sess.paused){ resumeSession(); }
  else { endSession(); }
}
function startSession(){
  const ml = mode==='pump'||mode==='bottle' ? Number(document.getElementById('mlInput')?.value||0) : 0;
  sess={mode,start:Date.now(),acc:0,paused:false,side:curSide||'L',sides:{L:0,R:0},ml:ml||0};
  saveSess(); buzz(18); render();
}
function togglePause(){
  if(!sess) return;
  if(!sess.paused){ accrue(); sess.paused=true; }
  else { sess.paused=false; sess.start=Date.now(); }
  saveSess(); buzz(10); render();
}
function resumeSession(){ sess.paused=false; sess.start=Date.now(); saveSess(); buzz(10); render(); }
function endSession(){
  if(!sess) return;
  accrue();
  const total = sess.acc;                 // 毫秒，已结算完毕
  const rec={id:uid(),ts:sess.start,dur:Math.round(total/1000),mode:sess.mode};
  if(sess.mode==='breast'){ rec.L=sess.sides.L; rec.R=sess.sides.R; }  // 毫秒
  if(sess.mode==='pump'||sess.mode==='bottle') rec.ml=sess.ml||0;
  const keep = (rec.dur>=1 || rec.ml>0);
  if(keep) D.feeds.unshift(rec);
  sess=null; saveSess(); render(); save(); pushCloud();
  if(keep){
    bigToast('✅ 已记录 '+hhmm(rec.dur) + (rec.ml?(' · '+rec.ml+'ml'):''), ()=>{
      D.feeds=D.feeds.filter(f=>f.id!==rec.id);
      save(); render(); pushCloud(); bigToast('已撤销');
    });
  }else{
    bigToast('时长太短，没记录');
  }
}
function setSide(s){
  if(!sess){ curSide=s; render(); return; }        // 未开始：预选起始侧
  if(sess.mode==='breast'){ accrue(); sess.side=s; saveSess(); buzz(8); render(); }
}

/* 把流逝的时间结算进 acc + 当前侧。
   acc 是「已结算毫秒」，sides 是左右侧各自的已结算毫秒。
   每秒调一次 + 切边/暂停/结束时调一次，保证永不丢时长。 */
function accrue(){
  if(!sess||sess.paused) return;
  const el = Date.now() - sess.start;
  if(el>0){ sess.acc += el; sess.sides[sess.side] += el; }
  sess.start = Date.now();
}
/* elapsedSec / sideSec 必须「实时按时间戳算」，不能只读累加值。
   原因：手机切到后台（微信等）时 iOS 会冻结 JS 定时器，
   若靠 setInterval 累加，冻结期间的时长就丢了。
   现在：acc 是「已结算毫秒」，start 是「上次结算时刻」，
   两者相减即实时经过时间 —— 定时器恢复后 accrue 一次即可全部补回。 */
function elapsedSec(){
  if(!sess) return 0;
  if(sess.paused) return sess.acc/1000;
  return (sess.acc + (Date.now()-sess.start))/1000;
}
function sideSec(){
  if(!sess) return {L:0,R:0};
  const s={L:sess.sides.L,R:sess.sides.R};
  if(!sess.paused){ const el=Date.now()-sess.start; if(el>0) s[sess.side]+=el; }
  return s;
}

/* ================= 渲染 ================= */
function render(){
  // 顶栏
  document.getElementById('babyName').textContent = S.name||'宝宝';
  const last = D.feeds[0];
  const tf = D.feeds.filter(f=>f.ts>=today());
  const tfDur = tf.reduce((a,b)=>a+(b.dur||0),0);
  const tdD = D.diapers.filter(d=>d.ts>=today());
  const tdPee = tdD.filter(d=>d.type==='pee'||d.type==='both').length;
  const tdPoo = tdD.filter(d=>d.type==='poop'||d.type==='both').length;
  document.getElementById('topSub').textContent =
    (last? `距上次 ${hhmm((Date.now()-last.ts)/1000)} · `:'')
    + `今日 ${tf.length} 次 / ${hhmm(tfDur)}`
    + (tdPee||tdPoo ? ` · 💧${tdPee}${tdPoo?' 💩'+tdPoo:''}` : '')
    + (cloudMsg? ` · ${cloudMsg}`:'');

  // 模式段
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));

  // 主体
  const t=document.getElementById('timer'), big=document.getElementById('tBig'),
        cl=document.getElementById('tClock'), sub=document.getElementById('tSub'),
        hint=document.getElementById('hint');
  const sidesEl=document.getElementById('sides');
  t.classList.remove('run','paused');

  if(sess){
    const el=elapsedSec();
    cl.style.display='block'; big.style.display='none';
    cl.textContent=hhmmss(el);
    if(sess.paused){ t.classList.add('paused'); sub.textContent='已暂停 · 点击继续'; }
    else { t.classList.add('run'); sub.textContent='点击结束'; }
    document.getElementById('pauseBtn').style.display='';
    document.getElementById('pauseBtn').textContent = sess.paused?'继续':'暂停';

    if(mode==='breast'){
      sidesEl.style.display='flex';
      const s=sideSec();
      document.getElementById('lv').textContent=hhmmss(s.L/1000);
      document.getElementById('rv').textContent=hhmmss(s.R/1000);
      document.getElementById('sideL').classList.toggle('act',sess.side==='L');
      document.getElementById('sideR').classList.toggle('act',sess.side==='R');
      const lim=(S.sideMin||12)*60*1000;   // 毫秒
      const urge = sess.side==='L'? s.R>=lim : s.L>=lim;
      document.getElementById('sideL').classList.toggle('urge',urge&&sess.side==='R');
      document.getElementById('sideR').classList.toggle('urge',urge&&sess.side==='L');
      const cur=sess.side==='L'?s.L:s.R;
      hint.textContent = urge? '该换边了' : (cur>=lim? '可以换边了':'');
      hint.classList.toggle('alarm',!!urge);
    } else { sidesEl.style.display='none'; hint.textContent=''; hint.classList.remove('alarm'); }
  } else {
    cl.style.display='none'; big.style.display='block';
    big.textContent = mode==='breast'?'开始亲喂' : mode==='bottle'?'开始瓶喂':'开始吸奶';
    sub.textContent = '点击一下开始';
    document.getElementById('pauseBtn').style.display='none';
    // 母乳模式下即使没开始，也显示左右侧（可预选起始侧）
    if(mode==='breast'){
      sidesEl.style.display='flex';
      document.getElementById('lv').textContent='0:00';
      document.getElementById('rv').textContent='0:00';
      document.getElementById('sideL').classList.toggle('act',curSide==='L');
      document.getElementById('sideR').classList.toggle('act',curSide==='R');
      document.getElementById('sideL').classList.remove('urge');
      document.getElementById('sideR').classList.remove('urge');
    } else { sidesEl.style.display='none'; }
    hint.textContent=''; hint.classList.remove('alarm');
  }

  // ml 输入（瓶喂/吸奶）
  let mlBox=document.getElementById('mlBox');
  if(mode!=='breast'){
    if(!mlBox){
      mlBox=document.createElement('div');
      mlBox.id='mlBox'; mlBox.className='acts'; mlBox.style.marginTop='14px';
      mlBox.innerHTML='<div style="flex:1;display:flex;gap:6px;justify-content:center">'+
        [60,90,120,150,180].map(v=>`<button class="mlc" onclick="pickMl(${v},this)">${v}</button>`).join('')+
        '</div>';
      document.querySelector('.stage').insertBefore(mlBox, document.querySelector('.acts'));
    }
    mlBox.style.display='';
    if(!mlBox.querySelector('input')){
      const inp=document.createElement('input');
      inp.type='number'; inp.id='mlInput'; inp.placeholder='毫升';
      inp.style.cssText='width:88px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center;font-size:16px';
      inp.oninput=()=>{ mlBox.querySelectorAll('.mlc').forEach(b=>b.classList.remove('on')); };
      mlBox.querySelector('div').appendChild(inp);
    }
  } else if(mlBox){ mlBox.style.display='none'; }

  renderRecent(); renderLog(); renderStats();
}
function pickMl(v,el){ document.getElementById('mlInput').value=v; mlBox.querySelectorAll('.mlc').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }

function feedDesc(f){
  if(f.mode==='breast'){
    const L=hhmm((f.L||0)/1000), R=hhmm((f.R||0)/1000);
    const dur=hhmm(f.dur||0);
    return {a:'母乳亲喂', b:`左 ${L} · 右 ${R} · 共 ${dur}`};
  }
  if(f.mode==='pump') return {a:'吸奶', b:(f.ml?f.ml+' 毫升':'')};
  return {a:'瓶喂', b:(f.ml?f.ml+' 毫升':'')};
}
function renderRecent(){
  const box=document.getElementById('recent');
  // 统一时间线：喂奶 + 尿布 + 体重，最近 6 条
  const evs=[];
  D.feeds.forEach(f=>evs.push({kind:'feed',ts:f.ts,o:f}));
  D.diapers.forEach(d=>evs.push({kind:'diaper',ts:d.ts,o:d}));
  D.weights.forEach(w=>evs.push({kind:'weight',ts:w.ts,o:w}));
  evs.sort((a,b)=>b.ts-a.ts);
  const list=evs.slice(0,6);

  box.innerHTML = list.length? list.map(e=>{
    const t=clock(e.ts);
    if(e.kind==='feed'){
      const d=feedDesc(e.o);
      return `<div class="row" onclick="jumpLog()">
        <div class="t">${t}</div>
        <div class="m"><div class="a">${d.a}</div><div class="b">${d.b||''}</div></div>
        <div class="d">${hhmmss(e.o.dur||0)}</div></div>`;
    }
    if(e.kind==='diaper'){
      const dd=e.o;
      const lbl = dd.type==='poop'?'💩 大便': dd.type==='both'?'💧💩 尿了+大便':'💧 尿了';
      return `<div class="row" onclick="jumpLog()">
        <div class="t">${t}</div>
        <div class="m"><div class="a">${lbl}</div><div class="b">尿布</div></div>
        <div class="d"></div></div>`;
    }
    return `<div class="row" onclick="jumpLog()">
      <div class="t">${t}</div>
      <div class="m"><div class="a">⚖ 体重</div><div class="b">${kgToJin(e.o.kg)} 斤</div></div>
      <div class="d"></div></div>`;
  }).join('') : `<div class="empty">还没有记录 · 点上面大圆开始</div>`;
}

/* 从最近记录点进去 → 跳到记录页并直接进多选，方便批量删 */
function jumpLog(){
  go('log');
  if(!selectMode) toggleSelect();
}
/* ================= 多选删除 ================= */
let selectMode=false;
const selected=new Set();
function rowKey(kind,id){ return kind+':'+id; }

function toggleSelect(){
  selectMode=!selectMode; selected.clear();
  const b=document.getElementById('selToggle');
  if(b){ b.textContent = selectMode?'取消':'批量'; b.classList.toggle('on', selectMode); }
  document.body.classList.toggle('selecting', selectMode);
  renderLog(); updateSelBar();
}
function rowTap(kind,id){
  if(selectMode){
    const k=rowKey(kind,id);
    if(selected.has(k)) selected.delete(k); else selected.add(k);
    renderLog(); updateSelBar(); buzz(8);
    return;
  }
  if(kind==='feed') delFeed(id);
  else if(kind==='diaper') delDiaper(id);
  else delWeight(id);
}
function updateSelBar(){
  const bar=document.getElementById('selBar');
  if(bar) bar.classList.toggle('on', selectMode);
  const c=document.getElementById('selCount');
  if(c) c.textContent='已选 '+selected.size+' 条';
}
function selToday(){
  const t0=today();
  D.feeds.forEach(f=>{ if(f.ts>=t0) selected.add(rowKey('feed',f.id)); });
  D.diapers.forEach(d=>{ if(d.ts>=t0) selected.add(rowKey('diaper',d.id)); });
  D.weights.forEach(w=>{ if(w.ts>=t0) selected.add(rowKey('weight',w.id)); });
  renderLog(); updateSelBar();
}
function selAll(){
  D.feeds.forEach(f=>selected.add(rowKey('feed',f.id)));
  D.diapers.forEach(d=>selected.add(rowKey('diaper',d.id)));
  D.weights.forEach(w=>selected.add(rowKey('weight',w.id)));
  renderLog(); updateSelBar();
}
/* 只选某一类：diaper / feed / weight */
function selKind(kind){
  if(kind==='diaper') D.diapers.forEach(d=>selected.add(rowKey('diaper',d.id)));
  else if(kind==='feed') D.feeds.forEach(f=>selected.add(rowKey('feed',f.id)));
  else D.weights.forEach(w=>selected.add(rowKey('weight',w.id)));
  renderLog(); updateSelBar();
}
function toggleMore(){
  const m=document.getElementById('selMore');
  const b=document.getElementById('moreBtn');
  if(m) m.classList.toggle('on');
  if(b) b.textContent = (m&&m.classList.contains('on')) ? '收起 ▴' : '更多 ▾';
}
function hideMore(){
  const m=document.getElementById('selMore');
  const b=document.getElementById('moreBtn');
  if(m) m.classList.remove('on');
  if(b) b.textContent='更多 ▾';
}
function selInvert(){
  const all=[];
  D.feeds.forEach(f=>all.push(rowKey('feed',f.id)));
  D.diapers.forEach(d=>all.push(rowKey('diaper',d.id)));
  D.weights.forEach(w=>all.push(rowKey('weight',w.id)));
  all.forEach(k=>{ if(selected.has(k)) selected.delete(k); else selected.add(k); });
  renderLog(); updateSelBar();
}
function delSelected(){
  const n=selected.size;
  if(!n){ bigToast('还没选任何记录'); return; }
  if(!confirm('删除选中的 '+n+' 条记录？删了不能恢复')) return;
  const ids={feed:new Set(),diaper:new Set(),weight:new Set()};
  selected.forEach(k=>{ const i=k.indexOf(':'); ids[k.slice(0,i)].add(k.slice(i+1)); });
  markDeleted('feed',   Array.from(ids.feed));
  markDeleted('diaper', Array.from(ids.diaper));
  markDeleted('weight', Array.from(ids.weight));
  D.feeds=D.feeds.filter(f=>!ids.feed.has(f.id));
  D.diapers=D.diapers.filter(d=>!ids.diaper.has(d.id));
  D.weights=D.weights.filter(w=>!ids.weight.has(w.id));
  selected.clear(); selectMode=false;
  const b=document.getElementById('selToggle');
  if(b){ b.textContent='批量'; b.classList.remove('on'); }
  document.body.classList.remove('selecting');
  updateSelBar();
  save(); render(); pushCloud();
  bigToast('已删除 '+n+' 条');
}

function renderLog(){
  const box=document.getElementById('logAll');
  const total=D.feeds.length+D.diapers.length+D.weights.length;
  if(!total){ box.innerHTML='<div class="empty">暂无记录</div>'; return; }

  // 统一时间线：喂奶 + 尿布 + 体重
  const events=[];
  D.feeds.forEach(f=>events.push({kind:'feed', ts:f.ts, o:f}));
  D.diapers.forEach(d=>events.push({kind:'diaper', ts:d.ts, o:d}));
  D.weights.forEach(w=>events.push({kind:'weight', ts:w.ts, o:w}));
  events.sort((a,b)=>b.ts-a.ts);

  // 按天分组
  const groups={};
  events.forEach(e=>{ const k=dayKey(e.ts); (groups[k]=groups[k]||[]).push(e); });
  const days=Object.keys(groups).sort().reverse();

  let html='';
  days.forEach(k=>{
    const es=groups[k];
    const feedsOfDay=es.filter(e=>e.kind==='feed');
    const tot=feedsOfDay.reduce((a,b)=>a+(b.o.dur||0),0);
    const peeOfDay=es.filter(e=>e.kind==='diaper'&&(e.o.type==='pee'||e.o.type==='both')).length;
    const pooOfDay=es.filter(e=>e.kind==='diaper'&&(e.o.type==='poop'||e.o.type==='both')).length;

    let label=`${k} · 喂奶 ${feedsOfDay.length} 次 / ${hhmm(tot)}`;
    if(peeOfDay||pooOfDay) label+=(peeOfDay?' · 💧'+peeOfDay:'')+(pooOfDay?' 💩'+pooOfDay:'');
    html+=`<div class="daylabel">${label}</div>`;

    // 计算相邻喂奶间隔
    const feedTs=feedsOfDay.map(e=>e.o.ts).sort((a,b)=>b-a);

    html+=es.map(e=>{
      const t=clock(e.ts);
      if(e.kind==='feed'){
        const f=e.o, d=feedDesc(f);
        const idx=feedTs.indexOf(f.ts);
        const prev=idx>=0 && idx<feedTs.length-1 ? feedTs[idx+1] : null;
        const gap=prev? hhmm((f.ts-prev)/1000):'';
        const sel = selectMode && selected.has(rowKey('feed',f.id));
        return `<div class="row${sel?' sel':''}" onclick="rowTap('feed','${f.id}')">
          ${selectMode?'<div class="ck">✓</div>':''}
          <div class="t">${t}</div>
          <div class="m"><div class="a">${d.a}</div>
            <div class="b">${d.b||''}${gap?' · 距上次 '+gap:''}</div></div>
          <div class="d">${hhmmss(f.dur||0)}</div></div>`;
      }
      if(e.kind==='diaper'){
        const dd=e.o;
        const lbl = dd.type==='poop'?'💩 大便': dd.type==='both'?'💧💩 尿了+大便':'💧 尿了';
        const sel = selectMode && selected.has(rowKey('diaper',dd.id));
        return `<div class="row${sel?' sel':''}" onclick="rowTap('diaper','${dd.id}')">
          ${selectMode?'<div class="ck">✓</div>':''}
          <div class="t">${t}</div>
          <div class="m"><div class="a">${lbl}</div><div class="b">尿布</div></div>
          <div class="d"></div></div>`;
      }
      const w=e.o;
      const selW = selectMode && selected.has(rowKey('weight',w.id));
      return `<div class="row${selW?' sel':''}" onclick="rowTap('weight','${w.id}')">
        ${selectMode?'<div class="ck">✓</div>':''}
        <div class="t">${t}</div>
        <div class="m"><div class="a">⚖ 体重</div><div class="b">${kgToJin(w.kg)} 斤</div></div>
        <div class="d"></div></div>`;
    }).join('');
  });
  box.innerHTML=html;
}

function delDiaper(id){
  if(!confirm('删除这条尿布记录？')) return;
  markDeleted('diaper', id);
  D.diapers=D.diapers.filter(d=>d.id!==id); save(); render(); pushNow();

function delWeight(id){

  markDeleted('weight', id);
  D.weights=D.weights.filter(w=>w.id!==id); save(); render(); pushNow();
  bigToast('已删除 1 条');
}
function renderStats(){
  const tf=D.feeds.filter(f=>f.ts>=today());
  const dur=tf.reduce((a,b)=>a+(b.dur||0),0);
  const gaps=[]; for(let i=0;i<tf.length-1;i++) gaps.push((tf[i].ts-tf[i+1].ts)/3600000);
  const avgGap = gaps.length? gaps.reduce((a,b)=>a+b,0)/gaps.length : 0;
  const td=D.diapers.filter(d=>d.ts>=today());
  const pee=td.filter(d=>d.type!=='poop').length, poo=td.filter(d=>d.type==='poop').length;
  const ml=D.feeds.filter(f=>f.ts>=today()&&f.ml).reduce((a,b)=>a+b.ml,0);
  const lastW=D.weights[0];
  document.getElementById('statToday').innerHTML=[
    ['喂奶次数',tf.length,'次'],['喂奶总时长',Math.round(dur/60),'分'],
    ['平均间隔',avgGap?avgGap.toFixed(1):'—','小时'],['距上次喂',D.feeds[0]?Math.round((Date.now()-D.feeds[0].ts)/60000):'—','分']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');
  document.getElementById('statExtra').innerHTML=[
    ['尿布',pee,'次'],['大便',poo,'次'],
    ['今日奶量',ml,'ml'],['最新体重',lastW?kgToJin(lastW.kg):'—',lastW?'斤':'']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  // 7 天柱状
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d.getTime()); }
  const durs=days.map(d0=>D.feeds.filter(f=>f.ts>=d0&&f.ts<d0+86400000).reduce((a,b)=>a+(b.dur||0),0));
  const cnts=days.map(d0=>D.feeds.filter(f=>f.ts>=d0&&f.ts<d0+86400000).length);
  const mxD=Math.max(...durs,1), mxC=Math.max(...cnts,1);
  const lb=d=>{const x=new Date(d);return `${x.getMonth()+1}/${x.getDate()}`};
  document.getElementById('bars7').innerHTML=days.map((d,i)=>
    `<div class="b"><div class="bar ${durs[i]===mxD&&mxD>0?'hi':''}" style="height:${Math.round(durs[i]/mxD*82)}px"></div><div class="lb">${lb(d)}</div></div>`).join('');
  document.getElementById('barsN').innerHTML=days.map((d,i)=>
    `<div class="b"><div class="bar ${cnts[i]===mxC&&mxC>0?'hi':''}" style="height:${Math.round(cnts[i]/mxC*82)}px"></div><div class="lb">${lb(d)}</div></div>`).join('');

  /* ---------- 喂养方式环形图 ---------- */
  const modeStat={breast:0,bottle:0,pump:0};
  D.feeds.forEach(f=>{ if(modeStat[f.mode]!==undefined) modeStat[f.mode]+=(f.dur||0); });
  const mTot=modeStat.breast+modeStat.bottle+modeStat.pump;
  const MCOL={breast:'#F0A868', bottle:'#5FD08A', pump:'#6BA8F5'};
  const MNAME={breast:'母乳亲喂', bottle:'瓶喂', pump:'吸奶'};
  if(mTot>0){
    let acc=0, segs='';
    ['breast','bottle','pump'].forEach(k=>{
      const pct=modeStat[k]/mTot*100;
      if(pct<=0) return;
      segs+=`${MCOL[k]} ${acc.toFixed(2)}% ${(acc+pct).toFixed(2)}%,`;
      acc+=pct;
    });
    document.getElementById('donut').style.background=`conic-gradient(${segs})`;
    document.getElementById('donut').innerHTML=
      `<div class="donut-center"><div>${Math.round(mTot/60)}<small style="font-size:9px;display:block;margin-top:1px">分钟</small></div></div>`;
    document.getElementById('donutLegend').innerHTML=['breast','bottle','pump'].map(k=>{
      const pct=mTot? Math.round(modeStat[k]/mTot*100):0;
      const mins=Math.round(modeStat[k]/60);
      return `<div class="lg-row"><span class="lg-dot" style="background:${MCOL[k]}"></span>
        <span class="lg-name">${MNAME[k]}</span>
        <span class="lg-val">${mins}分 <small style="color:var(--mut);font-weight:400">${pct}%</small></span></div>`;
    }).join('');
  } else {
    document.getElementById('donut').style.background='var(--card2)';
    document.getElementById('donut').innerHTML='<div class="donut-center">暂无<br>数据</div>';
    document.getElementById('donutLegend').innerHTML='<div class="empty-s">还没有记录</div>';
  }

  /* ---------- 左右侧时长 ---------- */
  let sumL=0, sumR=0;
  D.feeds.forEach(f=>{ if(f.mode==='breast'){ sumL+=(f.L||0); sumR+=(f.R||0); } });
  const lrTot=sumL+sumR;
  if(lrTot>0){
    const pL=Math.round(sumL/lrTot*100);
    document.getElementById('lrBar').innerHTML=
      `<div class="lr-seg" style="width:${pL}%;background:#F0A868">${pL}%</div>
       <div class="lr-seg" style="width:${100-pL}%;background:#6BA8F5">${100-pL}%</div>`;
    document.getElementById('lrTxt').innerHTML=
      `<span>左侧 ${Math.round(sumL/60000)} 分钟</span><span>右侧 ${Math.round(sumR/60000)} 分钟</span>`;
  } else {
    document.getElementById('lrBar').innerHTML='<div class="lr-seg" style="width:100%;background:var(--card2);color:var(--mut)">暂无亲喂记录</div>';
    document.getElementById('lrTxt').innerHTML='<span>左 0 分钟</span><span>右 0 分钟</span>';
  }

  /* ---------- 24 小时分布 ---------- */
  const hours=new Array(24).fill(0);
  D.feeds.forEach(f=>{ hours[new Date(f.ts).getHours()]+=1; });
  const hMax=Math.max.apply(null,hours.concat([1]));
  document.getElementById('hourBars').innerHTML=hours.map((v,i)=>
    `<div class="h"><div class="hb ${v===hMax&&v>0?'hi':''}" style="height:${v>0?Math.max(4,Math.round(v/hMax*60)):2}px"></div>
     ${i%3===0?`<div class="hl">${i}</div>`:'<div class="hl">&nbsp;</div>'}</div>`).join('');

  /* ---------- 间隔统计 ---------- */
  const sorted=D.feeds.slice().sort((a,b)=>a.ts-b.ts);
  const allGaps=[];
  for(let i=1;i<sorted.length;i++) allGaps.push((sorted[i].ts-sorted[i-1].ts)/60000);
  const gArr=allGaps.length?allGaps:[0];
  document.getElementById('statGap').innerHTML=[
    ['最短间隔', allGaps.length?Math.round(Math.min.apply(null,allGaps)):0, '分'],
    ['最长间隔', allGaps.length?Math.round(Math.max.apply(null,allGaps)):0, '分'],
    ['中位间隔', allGaps.length?Math.round(allGaps.slice().sort((a,b)=>a-b)[Math.floor(allGaps.length/2)]):0, '分'],
    ['间隔≥3小时', allGaps.filter(g=>g>=180).length, '次'],
    ['夜间喂奶', D.feeds.filter(f=>{const h=new Date(f.ts).getHours();return h>=22||h<6;}).length, '次'],
    ['白天喂奶', D.feeds.filter(f=>{const h=new Date(f.ts).getHours();return h>=6&&h<22;}).length, '次']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  /* ---------- 累计 ---------- */
  const allDur=D.feeds.reduce((a,b)=>a+(b.dur||0),0);
  const allMl=D.feeds.filter(f=>f.ml).reduce((a,b)=>a+b.ml,0);
  const daySet=new Set(D.feeds.map(f=>dayStart(f.ts)));
  const first=D.feeds.length?Math.min.apply(null,D.feeds.map(f=>f.ts)):0;
  const nDays=daySet.size;
  document.getElementById('statAll').innerHTML=[
    ['累计喂奶', D.feeds.length, '次'],
    ['累计时长', Math.round(allDur/60), '分'],
    ['累计奶量', allMl, 'ml'],
    ['记录天数', nDays, '天'],
    ['日均次数', nDays?Math.round(D.feeds.length/nDays*10)/10:0, '次'],
    ['尿布总数', D.diapers.length, '次'],
    ['体重记录', D.weights.length, '条'],
    ['最早记录', first?new Date(first).toLocaleDateString('zh-CN'):'—', '']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  /* ---------- 14 天趋势 ---------- */
  const t14=[], lb14=[];
  const now0=new Date(); now0.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){
    const d0=now0.getTime()-i*86400000, d1=d0+86400000;
    const list=D.feeds.filter(f=>f.ts>=d0&&f.ts<d1);
    t14.push(list.reduce((a,b)=>a+(b.dur||0),0));
    const dt=new Date(d0); lb14.push((dt.getMonth()+1)+'/'+dt.getDate());
  }
  const tMax=Math.max.apply(null,t14.concat([1]));
  const tMaxIdx=t14.indexOf(Math.max.apply(null,t14));
  document.getElementById('trend14').innerHTML=t14.map((v,i)=>
    `<div class="t"><div class="tb ${i===tMaxIdx&&v>0?'hi':''}" style="height:${v>0?Math.max(3,Math.round(v/tMax*58)):2}px"></div>
     <div class="tl">${i%2===0?lb14[i]:''}</div></div>`).join('');
}

function commitDiaper(){
  if(!diaperSel){ bigToast('先选一种尿布类型'); return; }
  addDiaper(diaperSel);
}
function addDiaper(t){
  const label = t==='pee'?'💧 尿了': t==='poop'?'💩 大便':'💧💩 都有';

  // ① 防重复：30 秒内同一类型不再记（防止连点手滑）
  //    不同类型（尿了→大便）不拦，那是真实情况
  const sameList=D.diapers.filter(d=>d.type===t);
  const lastSame=sameList.length? sameList.reduce((a,b)=>a.ts>b.ts?a:b) : null;
  if(lastSame){
    const ago=Math.floor((Date.now()-lastSame.ts)/1000);   // 秒
    if(ago < DUP_WINDOW_SEC){

      buzz(30);
      bigToast('⏱ 刚记过「'+label+'」，还要等 '+(DUP_WINDOW_SEC-ago)+' 秒');
      return;
    }
  }

  // ③ 记录
  const rec={id:uid(),ts:Date.now(),type:t};
  D.diapers.unshift(rec);
  save(); render(); pushCloud();

  const pee=D.diapers.filter(d=>d.ts>=today()&&(d.type==='pee'||d.type==='both')).length;
  const poo=D.diapers.filter(d=>d.ts>=today()&&(d.type==='poop'||d.type==='both')).length;

  closeSheet();

  bigToast('✅ 已记录 '+label+'　今日 💧'+pee+' 💩'+poo, ()=>{
    D.diapers=D.diapers.filter(d=>d.id!==rec.id);
    save(); render(); pushCloud(); bigToast('已撤销');
  });
}

/* ---------- 主题 ---------- */
/* 主题选中态：直接写内联样式，不依赖 CSS 优先级 */
/* 主题分段控件：整组是一个轨道，选中项用「胶囊 + 滑块」高亮 */
function paintThemeSeg(){
  const seg=document.getElementById('themeSeg');
  if(!seg) return;
  const btns=[...seg.querySelectorAll('button')];
  if(!btns.length) return;
  let cur;
  try{ cur=localStorage.getItem(THEME_KEY) || S.theme || 'dark'; }catch(e){ cur=S.theme||'dark'; }

  // 滑块（只在有选中项时显示）
  let thumb=seg.querySelector('.seg-thumb');
  if(!thumb){
    thumb=document.createElement('div');
    thumb.className='seg-thumb';
    seg.appendChild(thumb);
  }
  const active=btns.find(b=>(b.dataset.t||'dark')===cur) || btns[0];
  // 等布局完成再量位置
  requestAnimationFrame(()=>{
    const sr=seg.getBoundingClientRect();
    const ar=active.getBoundingClientRect();
    if(!ar.width) return;
    thumb.style.width=ar.width+'px';
    thumb.style.height=ar.height+'px';
    thumb.style.transform='translateX('+(ar.left-sr.left)+'px)';
  });

  btns.forEach(b=>{
    const on=(b.dataset.t||'dark')===cur;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on?'true':'false');
    // 选中：橙色文字 + 深色底；未选中：灰字 + 透明底
    b.style.background = 'transparent';
    b.style.color = on ? 'var(--acc)' : 'var(--mut)';
    b.style.fontWeight = on ? '700' : '500';
    b.style.borderColor = 'transparent';
    b.style.boxShadow = 'none';
    b.style.transform = '';
    const label=b.dataset.t==='dark'?'深色': b.dataset.t==='light'?'浅色':'护眼';
    b.textContent = label;
  });
}

/* ================= 云端同步（按宝宝档案名分桶） ================= */
let cloudBusy=false, cloudMsg='';

function babyName(){ return (S.name||'宝宝').trim()||'宝宝'; }
function babyKey(){ return babyName(); }

/* 本地存一份「档案 → 数据」映射，切档案时读写这里 */
function localProfiles(){
  try{ return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}'); }
  catch(e){ return {}; }
}
function setLocalProfile(name, data){
  const p=localProfiles();
  p[name]=data;
  localStorage.setItem(CLOUD_KEY, JSON.stringify(p));
}
function getLocalProfile(name){
  return localProfiles()[name] || null;
}

/* 拉云端全量 */
async function cloudFetch(){
  if(!/^https?:/.test(CLOUD_READ)) return null;
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(), 9000);
    const r=await fetch(CLOUD_READ+'?t='+Date.now(), {cache:'no-store', signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    return (j && typeof j==='object') ? j : {};
  }catch(e){
    cloudMsg='云端读取失败：'+(e.message||e);
    return null;
  }
}

/* 写云端（整份覆盖） */
async function cloudPut(all){
  if(!/^https?:/.test(CLOUD_PUT)) return false;
  try{
    const r=await fetch(CLOUD_PUT, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(all)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return true;
  }catch(e){
    cloudMsg='云端保存失败：'+(e.message||e);
    return false;
  }
}

/* 按记录 id 去重合并（云端 + 本地，谁新用谁） */
function mergeProfile(remote, local){
  const r=Object.assign({feeds:[],diapers:[],weights:[],settings:{},tombstones:{}}, remote||{});
  const l=Object.assign({feeds:[],diapers:[],weights:[],settings:{},tombstones:{}}, local||{});
  // 墓碑：被删除的记录 id → 删除时间。任何一方删了，就以删除为准
  const tombstones=Object.assign({}, r.tombstones||{}, l.tombstones||{});
  const merged={feeds:[],diapers:[],weights:[],settings:Object.assign({}, r.settings, l.settings), tombstones};
  ['feeds','diapers','weights'].forEach(k=>{
    const map=new Map();
    (r[k]||[]).forEach(x=>{ if(!tombstones[x.id]) map.set(x.id,x); });
    (l[k]||[]).forEach(x=>{ if(!tombstones[x.id]) map.set(x.id,x); });
    merged[k]=Array.from(map.values()).sort((a,b)=>b.ts-a.ts);
  });
  return merged;
}

/* 标记删除（墓碑）—— 保证删除能传遍所有设备，不会被云端合并回来 */
function markDeleted(kind, ids){
  const arr=Array.isArray(ids)?ids:[ids];
  const now=Date.now();
  arr.forEach(id=>{ D.tombstones[id]=now; });
  // 墓碑最多留 90 天，之后清理（避免无限膨胀）
  const cutoff=now-90*86400000;
  Object.keys(D.tombstones).forEach(id=>{ if(D.tombstones[id]<cutoff) delete D.tombstones[id]; });
}
/* 立即推云端（删除类操作不等 2.5 秒防抖） */
async function pushNow(){
  clearTimeout(cloudTimer);
  cloudBusy=true;
  try{
    const all=await cloudFetch();
    if(all!==null){
      const k=babyKey();
      all[k]={feeds:D.feeds, diapers:D.diapers, weights:D.weights, settings:D.settings, tombstones:D.tombstones};
      for(const kk in localProfiles()) if(kk!==k && !all[kk]) all[kk]=localProfiles()[kk];
      if(await cloudPut(all)) setLocalProfile(k, all[k]);
    }
  }catch(e){}
  cloudBusy=false;
}

/* 切换到某个宝宝档案 */
async function switchBaby(name){
  name=(name||'').trim();
  if(!name) return;

  // 1. 当前档案先存回本地（没数据就不存，避免造出空档案）
  const curName=babyKey();
  const hasData = D.feeds.length||D.diapers.length||D.weights.length;
  if(curName && (hasData || curName!=='宝宝')){
    setLocalProfile(curName, {feeds:D.feeds, diapers:D.diapers, weights:D.weights, settings:D.settings});
  }

  // 2. 拉云端
  const all=await cloudFetch();
  if(all===null){
    // 拉不到就用本地缓存
    const loc=getLocalProfile(name);
    if(loc) applyProfile(name, loc);
    else { D.feeds=[];D.diapers=[];D.weights=[];D.settings={name}; }
    render(); return;
  }

  // 3. 合并云端 + 本地
  const merged=mergeProfile(all[name], getLocalProfile(name));
  merged.settings=Object.assign({}, merged.settings, {name});

  // 4. 应用（保留原来的主题偏好，不让换档案把主题重置）
  applyProfile(name, merged);   // 主题由 applyProfile 内部保留

  // 5. 把合并结果写回云端（顺便把别的档案也带上）
  all[name]=merged;
  for(const k in localProfiles()){
    if(k!==name && !all[k]) all[k]=localProfiles()[k];
  }
  await cloudPut(all);

  setUrlBaby(name);
  showToast('已切换到「'+name+'」', 2500);
}

function applyProfile(name, p){
  D.feeds=p.feeds||[];
  D.diapers=p.diapers||[];
  D.weights=p.weights||[];
  D.tombstones=p.tombstones||D.tombstones||{};
  // 注意：S 是 const 且 D.settings 与 S 同引用，
  // 这里必须「原地改」而不是替换对象，否则 S 会指向旧对象、名字改不掉
  const keepTheme=S.theme;
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S, p.settings||{}, {name});
  // 主题是设备级偏好：档案没带主题就沿用当前主题，别让切档案把主题重置
  if(keepTheme && !(p.settings && p.settings.theme)) S.theme=keepTheme;
  D.settings=S;
  save();
}

/* 强制更新：清 Service Worker + 缓存 + 重新加载 */
async function forceUpdate(){
  const btn=document.getElementById('verBtn');
  if(btn) btn.textContent='更新中…';
  try{
    if(navigator.serviceWorker){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs) await r.unregister();
    }
    if(window.caches){
      const ks=await caches.keys();
      for(const k of ks) await caches.delete(k);
    }
  }catch(e){}
  hardReload();
}

/* ================= 分享链接 ================= */
function getUrlBaby(){
  try{
    const q=new URLSearchParams(location.search);
    return (q.get('baby')||'').trim();
  }catch(e){ return ''; }
}

/* 地址栏同步当前档案名（刷新不丢） */
function setUrlBaby(name){
  try{
    const u=new URL(location.href);
    if(name) u.searchParams.set('baby', name);
    else u.searchParams.delete('baby');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  }catch(e){}
}

/* 分享用链接（name 为空 = 不带名字） */
function linkFor(name){
  const base = location.origin + location.pathname;
  const v = APP_VER ? '&v=' + APP_VER : '';
  return name ? base + '?baby=' + encodeURIComponent(name) + v : base + '?v=' + APP_VER;
}

/* 强制刷新当前页：清 SW + 清缓存 + 换 URL（带时间戳，绝不走缓存） */
async function hardReload(){
  try{
    if(navigator.serviceWorker){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs) await r.unregister();
    }
    if(window.caches){
      const ks=await caches.keys();
      for(const k of ks) await caches.delete(k);
    }
  }catch(e){}
  location.replace(location.pathname + '?baby=' + encodeURIComponent(babyKey()) + '&v=' + APP_VER + '&t=' + Date.now());
}

/* 轻提示（顶栏灰字，用于同步状态这类弱信息） */
let toastTimer=null;
function showToast(m, ms){

  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ cloudMsg=''; render(); }, ms||2600);
}

/* 大反馈条：操作成功用这个，带「撤销」 */
let bigToastTimer=null, __undoFn=null;
function bigToast(msg, undoFn, ms, delayMs){
  const box=document.getElementById('toast');
  const txt=document.getElementById('toastMsg');
  const btn=document.getElementById('toastUndo');
  if(!box||!txt) return;
  const show=()=>{
    txt.textContent=msg;
    __undoFn = typeof undoFn==='function' ? undoFn : null;
    btn.style.display = __undoFn ? '' : 'none';
    box.classList.add('on');
    buzz(18);
    clearTimeout(bigToastTimer);
    bigToastTimer=setTimeout(hideBigToast, ms||4000);
  };
  clearTimeout(bigToastTimer);
  if(delayMs) setTimeout(show, delayMs);
  else show();
}
function hideBigToast(){
  const box=document.getElementById('toast');
  if(box) box.classList.remove('on');
  __undoFn=null;
}
function __toastUndo(){
  if(__undoFn){ const f=__undoFn; __undoFn=null; f(); }
}

/* 防重复：同一类型 N 秒内只记一次 */
const DUP_WINDOW_SEC = 60;         // 尿布：60 秒内同类型不重复记（单位：秒）
const DUP_WINDOW_WEIGHT_SEC = 30;  // 体重：30 秒
function tooSoon(list, matchFn){
  const now=Date.now();
  return (list||[]).some(x=>now-x.ts < DUP_WINDOW_MS && matchFn(x));
}

/* 复制到剪贴板（含降级方案） */
async function copyText(t){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(t); return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}

/* 分享（withName=true 带宝宝名字） */
async function shareBaby(withName){
  const nm = withName ? babyKey() : '';
  const url = linkFor(nm);
  const title = withName ? (nm+' · 喂奶计时') : '喂奶计时';

  // 优先系统分享面板（手机上好用）
  if(navigator.share){
    try{
      await navigator.share({ title, text: withName ? ('一起记录'+nm+'的喂奶') : '喂奶计时', url });
      showToast('已打开分享');
      return;
    }catch(e){ /* 用户取消或不支持，走复制 */ }
  }
  const ok = await copyText(url);
  if(ok){
    showToast(withName ? ('链接已复制（带「'+nm+'」）') : '空白链接已复制', 2600);
  }else{
    // 复制失败 → 弹只读框，长按手动复制
    openSheet(`<h3>${withName?('分享「'+nm+'」'):'空白链接'}</h3>
      <div class="hint-line" style="text-align:left;padding:0 20px 10px">长按下面的链接，选择「全选 → 拷贝」</div>
      <input type="text" id="shareOut" readonly value="${url}"
        style="width:calc(100% - 40px);margin:0 20px;background:var(--card2);border:1px solid var(--line);
               border-radius:12px;padding:12px;font-size:13px;color:var(--tx)">
      <div class="actions"><button class="ghost" onclick="closeSheet()">关闭</button>
        <button class="pri" onclick="tryCopyAgain('${url.replace(/'/g,"\\'")}')">再试复制</button></div>`);
    setTimeout(()=>{
      const el=document.getElementById('shareOut');
      if(el){ el.focus(); el.select(); }
    },120);
  }
}

async function tryCopyAgain(url){

function doSwitchBaby(){
  const v=(document.getElementById('babyIn')?.value||'').trim();
  if(!v){ alert('请输入名字'); return; }
  closeSheet();
  switchBaby(v);
}

/* 记录变更后自动推云端（防抖） */
let cloudTimer=null;
function pushCloud(){
  if(cloudBusy) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async ()=>{
    cloudBusy=true;
    const all=await cloudFetch();
    if(all!==null){
      const k=babyKey();
      all[k]={feeds:D.feeds, diapers:D.diapers, weights:D.weights, settings:D.settings, tombstones:D.tombstones};
      for(const kk in localProfiles()) if(kk!==k && !all[kk]) all[kk]=localProfiles()[kk];
      const ok=await cloudPut(all);
      if(ok) setLocalProfile(k, all[k]);
    }
    cloudBusy=false;
  }, 2500);
}
function askNotify(){
  if(!('Notification' in window)){ alert('这个浏览器不支持通知'); return; }
  Notification.requestPermission().then(p=>{ fillSettings(); if(p==='granted') notify('喂奶计时','提醒已开启'); });
}
function notify(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  try{ new Notification(title,{body,icon:'icon-180.png',badge:'icon-180.png',tag:'feed'}); }catch(e){}
}
function dl(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ================= 提醒 ================= */
setInterval(()=>{
  accrue();          // 每秒结算，保证时长精确不丢
  render();
  checkNotify();
},1000);

function checkNotify(){
  const gap=S.gapMin||180;
  if(!D.feeds.length) return;
  const since=(Date.now()-D.feeds[0].ts)/60000;
  if(since<gap) return;
  const h=new Date().getHours();
  const q1=S.q1??22, q2=S.q2??6;
  const quiet = q1>q2 ? (h>=q1||h<q2) : (h>=q1&&h<q2);
  if(quiet && since < gap*1.5) return;
  if(Date.now()-lastNotified<60000) return;
  lastNotified=Date.now();
  notify('该喂奶了', `已经 ${Math.round(since/60*10)/10} 小时没喂宝宝了`);
}

/* ================= 启动 ================= */
document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.onclick=()=>{ if(sess) return; mode=b.dataset.m; render(); };
});
document.querySelectorAll('#themeSeg button').forEach(b=>{
  b.onclick=()=>{ setTheme(b.dataset.t); };
});
applyTheme();
render();
/* 版本号立刻显示（不用进设置页） */
(function(){ const vb=document.getElementById('verBtn'); if(vb) vb.textContent=APP_VER; })();

/* 启动时：如果本地有档案名，自动拉一次云端（拿到别人刚记的） */

(async function boot(){
  // ① 链接带 ?baby=名字 → 直接用该档案（家人点分享链接走这里）
  const urlBaby=getUrlBaby();
  if(urlBaby){
    if(urlBaby===babyKey() && (D.feeds.length||D.diapers.length)){
      // 已经是这个档案，只后台拉一次云端合并
      await switchBaby(urlBaby);
    }else{
      await switchBaby(urlBaby);
      showToast('已加载「'+urlBaby+'」的记录', 3000);
    }
    return;
  }
  // ② 无参数 → 用上次的档案，从云端拉一次
  const nm=babyKey();
  if(nm && nm!=='宝宝'){
    const all=await cloudFetch();
    const localHas = D.feeds.length || D.diapers.length || D.weights.length;

    if(all && all[nm]){
      // 云端有 → 合并
      const merged=mergeProfile(all[nm], getLocalProfile(nm));
      merged.settings=Object.assign({}, merged.settings, {name:nm});
      applyProfile(nm, merged);
      setLocalProfile(nm, merged);
      render();
      // 合并后本地比云端多 → 推回云端
      const remoteN=(all[nm].feeds||[]).length+(all[nm].diapers||[]).length+(all[nm].weights||[]).length;
      const localN=D.feeds.length+D.diapers.length+D.weights.length;
      if(localN>remoteN) pushCloud();
    }else if(all && localHas){
      // 云端没有这个档案，但本地有数据 → 主动上传（修复"分享出去看不到历史"）
      all[nm]={feeds:D.feeds, diapers:D.diapers, weights:D.weights, settings:D.settings, tombstones:D.tombstones};
      const ok=await cloudPut(all);
      if(ok){ setLocalProfile(nm, all[nm]); showToast('本机记录已上传云端', 2600); }
    }
    return;
  }
  // ③ 第一次用（没名字也没档案）→ 引导输入
  if(Object.keys(localProfiles()).length===0){
    showToast('先输入宝宝名字，开始记录', 3200);
    setTimeout(()=>openBabySwitch(), 400);
  }
})();
/* 注册 SW：URL 必须固定（带时间戳会导致每次都算新 SW → 无限重载）
   注册后用 reg.update() 强制检查一次更新，这个不会重复安装 */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    try{ reg.update(); }catch(e){}
    // 有新 SW 等待接管 → 让它立刻接管（不重载页面）
    if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
  }).catch(()=>{});
  // 注意：这里绝对不要在 controllerchange 里 location.reload()
  // —— 会和上面的注册形成无限循环
}
/* 页面回到前台时刷新；并且任何点击都刷新 ——
   iOS 在后台会冻结 JS 定时器，靠定时器驱动会显示旧值。
   时长本身按时间戳实时算（elapsedSec），所以只要 render 跑一次就是准的。 */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ accrue(); render(); } });
window.addEventListener('focus',()=>{ accrue(); render(); });
window.addEventListener('pageshow',()=>{ accrue(); render(); });
document.addEventListener('pointerdown',()=>{ if(sess){ accrue(); render(); } }, {passive:true});
</script>
<script>
/* 版本自检 + 硬刷新：独立 script，不受主程序影响。
   1) 线上 version.json 比本地新 → 跳到带时间戳的新 URL
   2) URL 里没有 _r 参数 → 强制重载一次（保证是最新文件，不吃浏览器缓存） */
(function(){
  var APP_VER='v27';
  function cur(){
    try{
      var v=JSON.parse(localStorage.getItem('feedtimer.cloud.v1')||'{}');
      return v.cur||'';
    }catch(e){ return ''; }
  }
  function jump(ver){
    // 防抖：10 秒内不重复跳（防跳转循环），但之后真要更新还能跳
    try{
      var last=parseInt(sessionStorage.getItem('feedtimer._jt')||'0',10);
      if(Date.now()-last < 10000) return;
      sessionStorage.setItem('feedtimer._jt', String(Date.now()));
    }catch(e){}
    var q='?baby='+encodeURIComponent(cur())+'&v='+ver+'&_r='+Date.now();
    location.replace(location.pathname+q);
  }
  function run(){
    // ② 只在版本不同时跳转（带 _r 破缓存）
    //    本地记录上次看到的版本；一致就什么都不做
    var q=new URLSearchParams(location.search);
    if(q.get('_r')){
      // 已经硬刷过一次 → 记下当前版本，别再跳
      try{ sessionStorage.setItem('feedtimer._seen', APP_VER); }catch(e){}
    }
    // ① 拉线上版本，跟当前页面对比
    fetch('./version.json?t='+Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok? r.json() : null; })
      .then(function(j){
        if(!j || !j.ver) return;
        if(j.ver!==APP_VER){
          jump(j.ver);              // 线上更新 → 跳过去
          return;
        }
        // 版本一致 → 什么都不做（避免任何自动跳转打扰用户）
      })
      .catch(function(){});
  }
  if(document.readyState==='complete') run();
  else window.addEventListener('load', run);
})();
</script>
