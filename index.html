<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1115">
<title>喂奶计时</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0F1115; --card:#171A21; --card2:#1E222B; --line:#262B36;
  --tx:#E9ECF3; --mut:#868DA0; --acc:#F0A868; --acc2:#6BA8F5; --ok:#5FD08A; --warn:#E86A6A;
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* 浅色主题 */
html[data-theme="light"]{
  --bg:#F5F6F8; --card:#FFFFFF; --card2:#EDEFF3; --line:#DFE3EA;
  --tx:#1A1D23; --mut:#6B7280; --acc:#D9813C; --acc2:#3B7FD4; --ok:#2E9E5B; --warn:#D34545;
}
/* 护眼主题 */
html[data-theme="eye"]{
  --bg:#1E2418; --card:#252C1F; --card2:#2C3426; --line:#39422F;
  --tx:#E4E8DC; --mut:#9AA38C; --acc:#C9A96A; --acc2:#7FB08A; --ok:#8FC97A; --warn:#D98B7A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  overscroll-behavior-y:none}
body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}

#app{max-width:520px;margin:0 auto}

/* ---------- 顶栏 ---------- */
.top{padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 8px;display:flex;align-items:center;gap:10px}
.baby{flex:1;min-width:0}
.baby h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baby .sub{margin-top:3px;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;
  font-size:17px;flex:none;border:1px solid var(--line)}

/* ---------- 模式切换 ---------- */
.seg{display:flex;gap:6px;padding:6px 20px 0}
.seg button{flex:1;padding:9px 0;border-radius:11px;background:var(--card);color:var(--mut);
  font-size:14px;border:1px solid var(--line);transition:.15s}
.seg button.on{background:var(--card2);color:var(--tx);border-color:var(--acc)}
.seg button.on[data-m="pump"]{border-color:var(--acc2)}
.seg button.on[data-m="bottle"]{border-color:var(--ok)}

/* ---------- 计时主体 ---------- */
.stage{padding:20px 20px 8px;display:flex;flex-direction:column;align-items:center}
.timer{position:relative;width:min(72vw,290px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line);transition:.3s}
.timer.run .ring{border-color:var(--acc);box-shadow:0 0 0 8px rgba(240,168,104,.09),0 0 44px rgba(240,168,104,.2)}
.timer.paused .ring{border-color:var(--mut);box-shadow:none}
.tbtn{position:relative;width:100%;height:100%;border-radius:50%;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.18s}
.timer.run .tbtn{background:rgba(240,168,104,.1)}
.tbtn:active{transform:scale(.97)}
.tbtn .big{font-size:20px;font-weight:600;color:var(--mut)}
.tbtn .clock{font-size:52px;font-weight:250;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.timer.run .tbtn .clock{color:var(--acc);font-weight:200}
.tbtn .sub{font-size:13px;color:var(--mut);margin-top:2px}
.hint{font-size:12.5px;color:var(--mut);margin-top:16px;text-align:center;min-height:18px}
.hint.alarm{color:var(--acc)}

/* 左右侧 */
.sides{display:flex;gap:10px;width:min(72vw,290px);margin-bottom:14px}
.side{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.side .lbl{font-size:12px;color:var(--mut)}
.side .v{font-size:19px;font-weight:300;font-variant-numeric:tabular-nums;margin-top:2px}
.side.act{border-color:var(--acc);background:rgba(240,168,104,.08)}
.side.act .v{color:var(--acc)}
.side.urge{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,168,104,.45)}50%{box-shadow:0 0 0 8px rgba(240,168,104,0)}}

/* 小动作行 */
.acts{display:flex;gap:8px;width:min(72vw,290px);margin-top:16px}
.acts button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 4px;
  font-size:13px;color:var(--tx)}
.acts button:active{background:var(--card2)}

/* ---------- 列表 ---------- */
.sec{padding:18px 20px 0}
.sec h2{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-size:15px;font-variant-numeric:tabular-nums;flex:none;width:52px;color:var(--tx)}
.row .m{flex:1;min-width:0}
.row .m .a{font-size:14.5px}
.row .m .b{font-size:12px;color:var(--mut);margin-top:2px}
.row .d{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.daylabel{padding:14px 15px 6px;font-size:12px;color:var(--mut)}
.empty{padding:26px 15px;text-align:center;color:var(--mut);font-size:13.5px}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:0 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat .k{font-size:11.5px;color:var(--mut)}
.stat .v{font-size:23px;font-weight:300;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--mut);margin-left:2px;font-weight:400}
.bars{padding:14px 15px;display:flex;align-items:flex-end;gap:5px;height:112px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .bar{width:100%;background:rgba(240,168,104,.35);border-radius:5px 5px 2px 2px;min-height:3px}
.bars .bar.hi{background:var(--acc)}
.bars .lb{font-size:10px;color:var(--mut)}

/* ---------- 设置 ---------- */
.fld{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.fld:last-child{border-bottom:0}
.fld .k{flex:1;font-size:14.5px}
.fld .k small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.fld input[type=text],.fld input[type=number]{background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;width:132px;text-align:right;font-variant-numeric:tabular-nums}
.fld input.short{width:78px}

/* 输入 + 确认按钮 */
.row-inline{display:flex;gap:8px;align-items:center;flex:1 1 190px;min-width:170px}
.row-inline input{flex:1 1 auto;min-width:96px;width:auto!important;text-align:left!important}
/* 名字行改成上下结构，避免挤压 */
.fld.stack{flex-direction:column;align-items:stretch;gap:10px;padding:16px 15px}
.fld.stack .k{flex:none}
.fld.stack .row-inline{width:100%;flex:0 0 auto}
.fld.stack .hint-line{text-align:left;margin-top:-2px}
.fld.stack input[type=text]{width:100%!important;text-align:left!important}
.mini-btn{
  background:var(--acc);color:#12161F;border:none;border-radius:11px;
  padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;
}
.mini-btn:active{opacity:.8}
.hint-line{font-size:11.5px;color:var(--ok);flex-basis:100%;text-align:right;min-height:0}
.hint-line.warn{color:var(--warn)}

/* 主题分段（设置页内） */
#themeSeg{padding:0;width:100%}
#themeSeg button{font-size:13px;padding:10px 0}

/* 环形图 */
.donut-wrap{display:flex;align-items:center;gap:18px;padding:14px 15px}
.donut{
  width:112px;height:112px;border-radius:56px;flex-shrink:0;position:relative;
  background:var(--card2);
}
.donut::after{
  content:'';position:absolute;inset:22px;border-radius:34px;background:var(--card);
}
.donut-center{
  position:absolute;inset:0;display:grid;place-items:center;z-index:2;
  font-size:17px;font-weight:600;color:var(--tx);text-align:center;line-height:1.1;
}
.donut-center>div{display:flex;flex-direction:column;align-items:center}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:9px}
.lg-row{display:flex;align-items:center;gap:8px;font-size:13px}
.lg-dot{width:9px;height:9px;border-radius:5px;flex-shrink:0}
.lg-name{flex:1;color:var(--mut)}
.lg-val{font-weight:600;font-variant-numeric:tabular-nums}

/* 左右侧条 */
.lr-bar{display:flex;height:26px;border-radius:13px;overflow:hidden;margin:14px 15px 10px;background:var(--card2)}
.lr-seg{display:grid;place-items:center;font-size:11.5px;color:#12161F;font-weight:600}
.lr-txt{padding:0 15px 14px;font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between}

/* 24 小时分布 */
.hours{display:flex;gap:2px;align-items:flex-end;height:86px;padding:14px 15px}
.hours .h{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.hours .hb{width:100%;background:rgba(107,168,245,.32);border-radius:3px 3px 1px 1px;min-height:2px}
.hours .hb.hi{background:var(--acc2)}
.hours .hl{font-size:8.5px;color:var(--mut);margin-top:4px}

/* 14 天趋势 */
.trend{display:flex;gap:3px;align-items:flex-end;height:76px;padding:14px 15px}
.trend .t{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.trend .tb{width:100%;border-radius:3px 3px 1px 1px;min-height:2px;background:rgba(240,168,104,.3)}
.trend .tb.hi{background:var(--acc)}
.trend .tl{font-size:8.5px;color:var(--mut);margin-top:4px;white-space:nowrap}

/* 统计小卡 */
.stats .stat{background:var(--card2);border-radius:13px;padding:12px 13px}
.stats .stat .k{font-size:11.5px;color:var(--mut)}
.stats .stat .v{font-size:22px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.stats .stat .v small{font-size:11px;font-weight:400;color:var(--mut);margin-left:3px}


/* 档案切换 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px}
.chips .chip{
  background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:13.5px;color:var(--mut);
}
.chips .chip.on{border-color:var(--acc);color:var(--acc)}
.swap{font-size:13px;color:var(--mut);font-weight:400;margin-left:2px}

.btnrow{display:flex;gap:9px;padding:16px 20px}
.btnrow button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:14px}
.btnrow button.danger{color:var(--warn);border-color:#3a2a2a}

/* ---------- 底部导航 ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,17,21,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:50}
.nav button{flex:1;padding:11px 0 12px;font-size:10.5px;color:var(--mut)}
.nav button .ic{display:block;font-size:19px;margin-bottom:3px;line-height:1}
.nav button.on{color:var(--acc)}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
.sheet.on{display:flex}
.sheet .panel{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + var(--safe-b));animation:up .22s}
@keyframes up{from{transform:translateY(18px);opacity:.6}}
.sheet h3{margin:0 0 16px;font-size:17px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:15px}
.chips button.on{border-color:var(--acc);color:var(--acc)}
.sheet input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:14px;font-size:24px;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:14px}
.sheet .actions{display:flex;gap:9px;margin-top:16px}
.sheet .actions button{flex:1;padding:14px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-size:15px}
.sheet .actions button.pri{background:var(--acc);color:#1a1206;border-color:var(--acc);font-weight:600}
.view{display:none;padding-bottom:10px}
.view.on{display:block}
</style>
</head>
<body>
<div id="app">

  <div class="top">
    <div class="baby" onclick="openBabySwitch()">
      <h1 id="babyName">宝宝 <span class="swap">⇄</span></h1>
      <div class="sub" id="topSub">—</div>
    </div>
    <button class="icon-btn" onclick="go('settings')">⚙</button>
  </div>

  <!-- ===== 计时 ===== -->
  <div class="view on" id="v-timer">
    <div class="seg" id="modeSeg">
      <button data-m="breast" class="on">母乳</button>
      <button data-m="bottle">瓶喂</button>
      <button data-m="pump">吸奶</button>
    </div>

    <div class="stage">
      <div class="sides" id="sides" style="display:none">
        <button class="side" id="sideL" onclick="setSide('L')">
          <div class="lbl">左侧</div><div class="v" id="lv">0:00</div>
        </button>
        <button class="side" id="sideR" onclick="setSide('R')">
          <div class="lbl">右侧</div><div class="v" id="rv">0:00</div>
        </button>
      </div>

      <div class="timer" id="timer">
        <div class="ring"></div>
        <button class="tbtn" id="mainBtn" onclick="toggleSession()">
          <div class="big" id="tBig">开始喂奶</div>
          <div class="clock" id="tClock" style="display:none">00:00</div>
          <div class="sub" id="tSub">点击一下开始</div>
        </button>
      </div>

      <div class="hint" id="hint"></div>

      <div class="acts">
        <button id="pauseBtn" onclick="togglePause()" style="display:none">暂停</button>
        <button onclick="openDiaper()">💧 尿布</button>
        <button onclick="openWeight()">⚖️ 体重</button>
      </div>
    </div>

    <div class="sec">
      <h2>最近记录</h2>
      <div class="card" id="recent"></div>
    </div>
  </div>

  <!-- ===== 记录 ===== -->
  <div class="view" id="v-log">
    <div class="sec" style="padding-top:16px">
      <h2>全部记录</h2>
      <div class="card" id="logAll"></div>
    </div>
  </div>

  <!-- ===== 统计 ===== -->
  <div class="view" id="v-stats">
    <div class="sec" style="padding-top:16px">
      <div class="card">
        <div class="k">今日</div>
        <div class="stats" id="statToday"></div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">近 7 天时长</div>
        <div class="bars" id="bars7"></div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">近 7 天次数</div>
        <div class="bars" id="barsN"></div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">喂养方式分布</div>
        <div class="donut-wrap">
          <div class="donut" id="donut"></div>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">左右侧时长</div>
        <div class="lr-bar" id="lrBar"></div>
        <div class="lr-txt" id="lrTxt"></div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">时段分布<small>几点喂得最多</small></div>
        <div class="hours" id="hourBars"></div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">记录间隔<small>相邻两次之间的间隔</small></div>
        <div class="stats" id="statGap"></div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">尿布与体重</div>
        <div class="stats" id="statExtra"></div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">累计</div>
        <div class="stats" id="statAll"></div>
      </div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="k">最近 14 天趋势</div>
        <div class="trend" id="trend14"></div>
      </div>
    </div>
  </div>

  <!-- ===== 设置 ===== -->
  <div class="view" id="v-settings">
    <div class="sec" style="padding-top:16px">
      <div class="card">
        <div class="fld stack">
          <div class="k">宝宝名字<small>改名字会切换档案 · 同名的人共享同一份记录</small></div>
          <div class="row-inline">
            <input type="text" id="setName" placeholder="宝宝昵称" maxlength="12"
                   oninput="markDirty('setName')">
            <button class="mini-btn" onclick="saveName()">确认</button>
          </div>
          <div class="hint-line" id="nameHint"></div>
        </div>
        <div class="fld">
          <div class="k">超时提醒间隔<small>超过这么久没喂就提醒</small></div>
          <input type="number" class="short" id="setGap" onchange="save()"><span style="color:var(--mut)">分钟</span>
        </div>
        <div class="fld">
          <div class="k">夜间免打扰<small>这个时段内不主动提醒</small></div>
          <input type="number" class="short" id="setQ1" onchange="save()">—<input type="number" class="short" id="setQ2" onchange="save()">
        </div>
        <div class="fld">
          <div class="k">换边提醒阈值<small>单侧喂够这么久提醒换边</small></div>
          <input type="number" class="short" id="setSide" onchange="save()"><span style="color:var(--mut)">分钟</span>
        </div>
        <div class="fld stack">
          <div class="k">主题<small>深色护眼 / 浅色 / 护眼绿</small></div>
          <div class="seg" id="themeSeg">
            <button data-t="dark" class="on">深色</button>
            <button data-t="light">浅色</button>
            <button data-t="eye">护眼</button>
          </div>
        </div>
        <div class="fld stack">
          <div class="k">分享给家人<small>带名字的链接，对方打开就是同一份记录</small></div>
          <div class="btnrow" style="padding:0">
            <button onclick="shareBaby(true)" id="shareBabyBtn">分享当前宝宝</button>
            <button onclick="shareBaby(false)">复制空白链接</button>
          </div>
          <div class="hint-line" id="shareHint"></div>
        </div>
        <div class="fld">
          <div class="k">通知权限<small>超时提醒需要系统通知</small></div>
          <button class="icon-btn" onclick="askNotify()" id="notifyBtn">开启</button>
        </div>
      </div>

    </div>
  </div>

  <div class="nav">
    <button class="on" data-v="timer" onclick="go('timer')"><span class="ic">⏱</span>计时</button>
    <button data-v="log" onclick="go('log')"><span class="ic">📋</span>记录</button>
    <button data-v="stats" onclick="go('stats')"><span class="ic">📊</span>统计</button>
    <button data-v="settings" onclick="go('settings')"><span class="ic">⚙</span>设置</button>
  </div>
</div>

<!-- 弹层 -->
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ================= 数据 ================= */
/* 本地：localStorage（离线可用、快）
   云端：COS shared/babies.json（多人共享）
   按「宝宝档案名」分桶：{ "王奕珩": {feeds:[],diapers:[],weights:[],settings:{}} } */

const hhmmss=sec=>{sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`};

const clock=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};

/* ================= 计时核心 ================= */
function toggleSession(){
  if(!sess){ startSession(); }
  else if(sess.paused){ resumeSession(); }
  else { endSession(); }
}
function startSession(){
  const ml = mode==='pump'||mode==='bottle' ? Number(document.getElementById('mlInput')?.value||0) : 0;
  sess={mode,start:Date.now(),acc:0,paused:false,side:curSide||'L',sides:{L:0,R:0},ml:ml||0};
  saveSess(); buzz(18); render();
}
function togglePause(){
  if(!sess) return;
  if(!sess.paused){ accrue(); sess.paused=true; }
  else { sess.paused=false; sess.start=Date.now(); }
  saveSess(); buzz(10); render();
}
function resumeSession(){ sess.paused=false; sess.start=Date.now(); saveSess(); buzz(10); render(); }
function endSession(){
  if(!sess) return;
  accrue();
  const total = sess.acc;                 // 毫秒，已结算完毕
  const rec={id:uid(),ts:sess.start,dur:Math.round(total/1000),mode:sess.mode};
  if(sess.mode==='breast'){ rec.L=sess.sides.L; rec.R=sess.sides.R; }  // 毫秒
  if(sess.mode==='pump'||sess.mode==='bottle') rec.ml=sess.ml||0;
  if(rec.dur>=1 || rec.ml){ D.feeds.unshift(rec); }
  sess=null; saveSess(); buzz(24); render(); save(); pushCloud();
}
function setSide(s){
  if(!sess){ curSide=s; render(); return; }        // 未开始：预选起始侧
  if(sess.mode==='breast'){ accrue(); sess.side=s; saveSess(); buzz(8); render(); }
}

/* 把流逝的时间结算进 acc + 当前侧。
   acc 是「已结算毫秒」，sides 是左右侧各自的已结算毫秒。
   每秒调一次 + 切边/暂停/结束时调一次，保证永不丢时长。 */
function accrue(){
  if(!sess||sess.paused) return;
  const el = Date.now() - sess.start;
  if(el>0){ sess.acc += el; sess.sides[sess.side] += el; }
  sess.start = Date.now();
}
/* elapsedSec / sideSec 必须「实时按时间戳算」，不能只读累加值。
   原因：手机切到后台（微信等）时 iOS 会冻结 JS 定时器，
   若靠 setInterval 累加，冻结期间的时长就丢了。
   现在：acc 是「已结算毫秒」，start 是「上次结算时刻」，
   两者相减即实时经过时间 —— 定时器恢复后 accrue 一次即可全部补回。 */
function elapsedSec(){
  if(!sess) return 0;
  if(sess.paused) return sess.acc/1000;
  return (sess.acc + (Date.now()-sess.start))/1000;
}
function sideSec(){
  if(!sess) return {L:0,R:0};
  const s={L:sess.sides.L,R:sess.sides.R};
  if(!sess.paused){ const el=Date.now()-sess.start; if(el>0) s[sess.side]+=el; }
  return s;
}

function feedDesc(f){
  if(f.mode==='breast'){
    const L=Math.round((f.L||0)/60000), R=Math.round((f.R||0)/60000);  // 毫秒 → 分钟
    const dur=Math.round((f.dur||0)/60);
    return {a:'母乳亲喂', b:`左 ${L}分 · 右 ${R}分 · 共 ${dur}分`};
  }
  if(f.mode==='pump') return {a:'吸奶', b:(f.ml?f.ml+' 毫升':'')};
  return {a:'瓶喂', b:(f.ml?f.ml+' 毫升':'')};
}
function renderRecent(){
  const box=document.getElementById('recent'); const list=D.feeds.slice(0,4);
  box.innerHTML = list.length? list.map(f=>{
    const d=feedDesc(f);
    return `<div class="row" onclick="delFeed('${f.id}')">
      <div class="t">${clock(f.ts)}</div>
      <div class="m"><div class="a">${d.a}</div><div class="b">${d.b||''}</div></div>
      <div class="d">${hhmmss(f.dur||0)}</div></div>`;
  }).join('') : `<div class="empty">还没有记录 · 点上面大圆开始</div>`;
}
function renderLog(){
  const box=document.getElementById('logAll');
  if(!D.feeds.length && !D.diapers.length){ box.innerHTML='<div class="empty">暂无记录</div>'; return; }
  const groups={};
  D.feeds.forEach(f=>{ (groups[dayKey(f.ts)]=groups[dayKey(f.ts)]||[]).push(f); });
  const days=Object.keys(groups).sort().reverse();
  let html='';
  days.forEach(k=>{
    const fs=groups[k];
    const tot=fs.reduce((a,b)=>a+(b.dur||0),0);
    html+=`<div class="daylabel">${k} · 共 ${fs.length} 次 / ${hhmm(tot)}</div>`;
    html+=fs.map((f,i)=>{
      const d=feedDesc(f); const prev=groups[k][i+1];
      const gap=prev? hhmm((f.ts-prev.ts)/1000):'';
      return `<div class="row" onclick="delFeed('${f.id}')">
        <div class="t">${clock(f.ts)}</div>
        <div class="m"><div class="a">${d.a}</div><div class="b">${d.b||''}${gap?' · 距上次 '+gap:''}</div></div>
        <div class="d">${hhmmss(f.dur||0)}</div></div>`;
    }).join('');
  });
  box.innerHTML=html;
}
function renderStats(){
  const tf=D.feeds.filter(f=>f.ts>=today());
  const dur=tf.reduce((a,b)=>a+(b.dur||0),0);
  const gaps=[]; for(let i=0;i<tf.length-1;i++) gaps.push((tf[i].ts-tf[i+1].ts)/3600000);
  const avgGap = gaps.length? gaps.reduce((a,b)=>a+b,0)/gaps.length : 0;
  const td=D.diapers.filter(d=>d.ts>=today());
  const pee=td.filter(d=>d.type!=='poop').length, poo=td.filter(d=>d.type==='poop').length;
  const ml=D.feeds.filter(f=>f.ts>=today()&&f.ml).reduce((a,b)=>a+b.ml,0);
  const lastW=D.weights[0];
  document.getElementById('statToday').innerHTML=[
    ['喂奶次数',tf.length,'次'],['喂奶总时长',Math.round(dur/60),'分'],
    ['平均间隔',avgGap?avgGap.toFixed(1):'—','小时'],['距上次喂',D.feeds[0]?Math.round((Date.now()-D.feeds[0].ts)/60000):'—','分']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');
  document.getElementById('statExtra').innerHTML=[
    ['尿布',pee,'次'],['大便',poo,'次'],
    ['今日奶量',ml,'ml'],['最新体重',lastW?lastW.kg:'—',lastW?'kg':'']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  // 7 天柱状
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d.getTime()); }
  const durs=days.map(d0=>D.feeds.filter(f=>f.ts>=d0&&f.ts<d0+86400000).reduce((a,b)=>a+(b.dur||0),0));
  const cnts=days.map(d0=>D.feeds.filter(f=>f.ts>=d0&&f.ts<d0+86400000).length);
  const mxD=Math.max(...durs,1), mxC=Math.max(...cnts,1);
  const lb=d=>{const x=new Date(d);return `${x.getMonth()+1}/${x.getDate()}`};
  document.getElementById('bars7').innerHTML=days.map((d,i)=>
    `<div class="b"><div class="bar ${durs[i]===mxD&&mxD>0?'hi':''}" style="height:${Math.round(durs[i]/mxD*82)}px"></div><div class="lb">${lb(d)}</div></div>`).join('');
  document.getElementById('barsN').innerHTML=days.map((d,i)=>
    `<div class="b"><div class="bar ${cnts[i]===mxC&&mxC>0?'hi':''}" style="height:${Math.round(cnts[i]/mxC*82)}px"></div><div class="lb">${lb(d)}</div></div>`).join('');

  /* ---------- 喂养方式环形图 ---------- */
  const modeStat={breast:0,bottle:0,pump:0};
  D.feeds.forEach(f=>{ if(modeStat[f.mode]!==undefined) modeStat[f.mode]+=(f.dur||0); });
  const mTot=modeStat.breast+modeStat.bottle+modeStat.pump;
  const MCOL={breast:'#F0A868', bottle:'#5FD08A', pump:'#6BA8F5'};
  const MNAME={breast:'母乳亲喂', bottle:'瓶喂', pump:'吸奶'};
  if(mTot>0){
    let acc=0, segs='';
    ['breast','bottle','pump'].forEach(k=>{
      const pct=modeStat[k]/mTot*100;
      if(pct<=0) return;
      segs+=`${MCOL[k]} ${acc.toFixed(2)}% ${(acc+pct).toFixed(2)}%,`;
      acc+=pct;
    });
    document.getElementById('donut').style.background=`conic-gradient(${segs})`;
    document.getElementById('donut').innerHTML=
      `<div class="donut-center"><div>${Math.round(mTot/60)}<small style="font-size:9px;display:block;margin-top:1px">分钟</small></div></div>`;
    document.getElementById('donutLegend').innerHTML=['breast','bottle','pump'].map(k=>{
      const pct=mTot? Math.round(modeStat[k]/mTot*100):0;
      const mins=Math.round(modeStat[k]/60);
      return `<div class="lg-row"><span class="lg-dot" style="background:${MCOL[k]}"></span>
        <span class="lg-name">${MNAME[k]}</span>
        <span class="lg-val">${mins}分 <small style="color:var(--mut);font-weight:400">${pct}%</small></span></div>`;
    }).join('');
  } else {
    document.getElementById('donut').style.background='var(--card2)';
    document.getElementById('donut').innerHTML='<div class="donut-center">暂无<br>数据</div>';
    document.getElementById('donutLegend').innerHTML='<div class="empty-s">还没有记录</div>';
  }

  /* ---------- 左右侧时长 ---------- */
  let sumL=0, sumR=0;
  D.feeds.forEach(f=>{ if(f.mode==='breast'){ sumL+=(f.L||0); sumR+=(f.R||0); } });
  const lrTot=sumL+sumR;
  if(lrTot>0){
    const pL=Math.round(sumL/lrTot*100);
    document.getElementById('lrBar').innerHTML=
      `<div class="lr-seg" style="width:${pL}%;background:#F0A868">${pL}%</div>
       <div class="lr-seg" style="width:${100-pL}%;background:#6BA8F5">${100-pL}%</div>`;
    document.getElementById('lrTxt').innerHTML=
      `<span>左侧 ${Math.round(sumL/60000)} 分钟</span><span>右侧 ${Math.round(sumR/60000)} 分钟</span>`;
  } else {
    document.getElementById('lrBar').innerHTML='<div class="lr-seg" style="width:100%;background:var(--card2);color:var(--mut)">暂无亲喂记录</div>';
    document.getElementById('lrTxt').innerHTML='<span>左 0 分钟</span><span>右 0 分钟</span>';
  }

  /* ---------- 24 小时分布 ---------- */
  const hours=new Array(24).fill(0);
  D.feeds.forEach(f=>{ hours[new Date(f.ts).getHours()]+=1; });
  const hMax=Math.max.apply(null,hours.concat([1]));
  document.getElementById('hourBars').innerHTML=hours.map((v,i)=>
    `<div class="h"><div class="hb ${v===hMax&&v>0?'hi':''}" style="height:${v>0?Math.max(4,Math.round(v/hMax*60)):2}px"></div>
     ${i%3===0?`<div class="hl">${i}</div>`:'<div class="hl">&nbsp;</div>'}</div>`).join('');

  /* ---------- 间隔统计 ---------- */
  const sorted=D.feeds.slice().sort((a,b)=>a.ts-b.ts);
  const allGaps=[];
  for(let i=1;i<sorted.length;i++) allGaps.push((sorted[i].ts-sorted[i-1].ts)/60000);
  const gArr=allGaps.length?allGaps:[0];
  document.getElementById('statGap').innerHTML=[
    ['最短间隔', allGaps.length?Math.round(Math.min.apply(null,allGaps)):0, '分'],
    ['最长间隔', allGaps.length?Math.round(Math.max.apply(null,allGaps)):0, '分'],
    ['中位间隔', allGaps.length?Math.round(allGaps.slice().sort((a,b)=>a-b)[Math.floor(allGaps.length/2)]):0, '分'],
    ['间隔≥3小时', allGaps.filter(g=>g>=180).length, '次'],
    ['夜间喂奶', D.feeds.filter(f=>{const h=new Date(f.ts).getHours();return h>=22||h<6;}).length, '次'],
    ['白天喂奶', D.feeds.filter(f=>{const h=new Date(f.ts).getHours();return h>=6&&h<22;}).length, '次']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  /* ---------- 累计 ---------- */
  const allDur=D.feeds.reduce((a,b)=>a+(b.dur||0),0);
  const allMl=D.feeds.filter(f=>f.ml).reduce((a,b)=>a+b.ml,0);
  const daySet=new Set(D.feeds.map(f=>dayStart(f.ts)));
  const first=D.feeds.length?Math.min.apply(null,D.feeds.map(f=>f.ts)):0;
  const nDays=daySet.size;
  document.getElementById('statAll').innerHTML=[
    ['累计喂奶', D.feeds.length, '次'],
    ['累计时长', Math.round(allDur/60), '分'],
    ['累计奶量', allMl, 'ml'],
    ['记录天数', nDays, '天'],
    ['日均次数', nDays?Math.round(D.feeds.length/nDays*10)/10:0, '次'],
    ['尿布总数', D.diapers.length, '次'],
    ['体重记录', D.weights.length, '条'],
    ['最早记录', first?new Date(first).toLocaleDateString('zh-CN'):'—', '']
  ].map(([k,v,u])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  /* ---------- 14 天趋势 ---------- */
  const t14=[], lb14=[];
  const now0=new Date(); now0.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){
    const d0=now0.getTime()-i*86400000, d1=d0+86400000;
    const list=D.feeds.filter(f=>f.ts>=d0&&f.ts<d1);
    t14.push(list.reduce((a,b)=>a+(b.dur||0),0));
    const dt=new Date(d0); lb14.push((dt.getMonth()+1)+'/'+dt.getDate());
  }
  const tMax=Math.max.apply(null,t14.concat([1]));
  const tMaxIdx=t14.indexOf(Math.max.apply(null,t14));
  document.getElementById('trend14').innerHTML=t14.map((v,i)=>
    `<div class="t"><div class="tb ${i===tMaxIdx&&v>0?'hi':''}" style="height:${v>0?Math.max(3,Math.round(v/tMax*58)):2}px"></div>
     <div class="tl">${i%2===0?lb14[i]:''}</div></div>`).join('');
}

function go(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('on',e.dataset.v===v));
  if(v==='settings') fillSettings();
  window.scrollTo(0,0);
}
function delFeed(id){
  if(!confirm('删除这条记录？')) return;
  D.feeds=D.feeds.filter(f=>f.id!==id); save(); render(); pushCloud();
}
function openSheet(html){ document.getElementById('panel').innerHTML=html; document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
function openDiaper(){
  openSheet(`<h3>尿布记录</h3>
    <div class="chips">
      <button onclick="addDiaper('pee')">💧 尿了</button>
      <button onclick="addDiaper('poop')">💩 大便</button>
      <button onclick="addDiaper('both')">💧💩 都有</button>
    </div>
    <div class="actions"><button onclick="closeSheet()">取消</button></div>`);
}
function addDiaper(t){
  D.diapers.unshift({id:uid(),ts:Date.now(),type:t}); save(); closeSheet(); buzz(14); render(); pushCloud();
}
function openWeight(){
  openSheet(`<h3>记录体重</h3>
    <input type="number" id="wIn" step="0.01" placeholder="公斤">
    <div class="actions"><button onclick="closeSheet()">取消</button><button class="pri" onclick="addWeight()">保存</button></div>`);
  setTimeout(()=>document.getElementById('wIn')?.focus(),60);
}
function addWeight(){
  const kg=Number(document.getElementById('wIn').value);
  if(!kg) return;
  D.weights.unshift({id:uid(),ts:Date.now(),kg}); save(); closeSheet(); buzz(14); render(); pushCloud();
}
function fillSettings(){
  // 只在「不正在编辑」时才回填，避免用户输入被冲掉
  const inp=document.getElementById('setName');
  if(inp && document.activeElement!==inp) inp.value=S.name||'';
  document.getElementById('setGap').value=S.gapMin||180;
  document.getElementById('setQ1').value=S.q1??22;
  document.getElementById('setQ2').value=S.q2??6;
  document.getElementById('setSide').value=S.sideMin||12;
  document.getElementById('notifyBtn').textContent = Notification.permission==='granted'?'已开启':'开启';
  // 主题选中态
  paintThemeSeg();
  const sb=document.getElementById('shareBabyBtn');
  if(sb) sb.textContent = '分享「'+(S.name||'宝宝')+'」';
}

/* ---------- 名字：确认后才保存 ---------- */
function markDirty(id){
  const h=document.getElementById('nameHint');
  if(h){ h.textContent='有改动，点「确认」保存'; h.classList.add('warn'); }
}
function saveName(){
  const inp=document.getElementById('setName');
  const h=document.getElementById('nameHint');
  const v=(inp.value||'').trim();
  if(!v){
    if(h){ h.textContent='名字不能为空'; h.classList.add('warn'); }
    inp.focus(); return;
  }
  if(v===(S.name||'')){
    if(h){ h.textContent='名字没变'; h.classList.remove('warn'); }
    return;
  }
  // 改名 = 切换档案：旧名字的数据留在旧档，新名字读云端（有就加载，没有就是空数据）
  const keepTheme = S.theme;
  if(h){ h.textContent='正在切换…'; h.classList.remove('warn'); }
  inp.value=v;
  switchBaby(v).then(()=>{
    if(!S.theme && keepTheme){ S.theme=keepTheme; save(); applyTheme(); }
    const h2=document.getElementById('nameHint');
    if(h2){
      h2.textContent = D.feeds.length||D.diapers.length||D.weights.length
        ? '已切到「'+v+'」，读到 '+D.feeds.length+' 条记录'
        : '已切到「'+v+'」（新档案，暂无记录）';
      h2.classList.remove('warn');
      setTimeout(()=>{ if(h2) h2.textContent=''; },4000);
    }
  });
}

/* ---------- 主题 ---------- */
/* 主题选中态：直接写内联样式，不依赖 CSS 优先级 */
function paintThemeSeg(){
  const btns=document.querySelectorAll('#themeSeg button');
  if(!btns.length) return;
  const cur=S.theme||'dark';
  btns.forEach(b=>{
    const on=(b.dataset.t||'dark')===cur;
    b.classList.toggle('on', on);
    b.style.background = on ? 'rgba(240,168,104,.16)' : 'transparent';
    b.style.color = on ? 'var(--acc)' : 'var(--mut)';
    b.style.borderColor = on ? 'var(--acc)' : 'var(--line)';
    b.style.fontWeight = on ? '600' : '400';
    b.style.boxShadow = on ? '0 0 0 1px var(--acc) inset' : 'none';
  });
}

function setTheme(t){
  S.theme=t;
  localStorage.setItem(KEY,JSON.stringify(D));
  document.documentElement.setAttribute('data-theme',t);
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', t==='light'?'#F5F6F8': t==='eye'?'#1E2418':'#0F1115');
  fillSettings();
  paintThemeSeg();
  render();
}
function applyTheme(){
  const t=S.theme||'dark';
  document.documentElement.setAttribute('data-theme',t);
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', t==='light'?'#F5F6F8': t==='eye'?'#1E2418':'#0F1115');
  paintThemeSeg();
}

function save(){ localStorage.setItem(KEY, JSON.stringify(D)); fillSettings(); }

/* ================= 云端同步（按宝宝档案名分桶） ================= */
let cloudBusy=false, cloudMsg='';

function babyName(){ return (S.name||'宝宝').trim()||'宝宝'; }
function babyKey(){ return babyName(); }

/* 本地存一份「档案 → 数据」映射，切档案时读写这里 */
function localProfiles(){
  try{ return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}'); }
  catch(e){ return {}; }
}
function setLocalProfile(name, data){
  const p=localProfiles();
  p[name]=data;
  localStorage.setItem(CLOUD_KEY, JSON.stringify(p));
}
function getLocalProfile(name){
  return localProfiles()[name] || null;
}

/* 拉云端全量 */
async function cloudFetch(){
  if(!/^https?:/.test(CLOUD_READ)) return null;
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(), 9000);
    const r=await fetch(CLOUD_READ+'?t='+Date.now(), {cache:'no-store', signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    return (j && typeof j==='object') ? j : {};
  }catch(e){
    cloudMsg='云端读取失败：'+(e.message||e);
    return null;
  }
}

/* 写云端（整份覆盖） */
async function cloudPut(all){
  if(!/^https?:/.test(CLOUD_PUT)) return false;
  try{
    const r=await fetch(CLOUD_PUT, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(all)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return true;
  }catch(e){
    cloudMsg='云端保存失败：'+(e.message||e);
    return false;
  }
}

/* 按记录 id 去重合并（云端 + 本地，谁新用谁） */
function mergeProfile(remote, local){
  const r=Object.assign({feeds:[],diapers:[],weights:[],settings:{}}, remote||{});
  const l=Object.assign({feeds:[],diapers:[],weights:[],settings:{}}, local||{});
  const merged={feeds:[],diapers:[],weights:[],settings:Object.assign({}, r.settings, l.settings)};
  ['feeds','diapers','weights'].forEach(k=>{
    const map=new Map();
    (r[k]||[]).forEach(x=>map.set(x.id,x));
    (l[k]||[]).forEach(x=>map.set(x.id,x));   // 本地覆盖同 id
    merged[k]=Array.from(map.values()).sort((a,b)=>b.ts-a.ts);
  });
  return merged;
}

/* 切换到某个宝宝档案 */
async function switchBaby(name){
  name=(name||'').trim();
  if(!name) return;

  // 1. 当前档案先存回本地（没数据就不存，避免造出空档案）
  const curName=babyKey();
  const hasData = D.feeds.length||D.diapers.length||D.weights.length;
  if(curName && (hasData || curName!=='宝宝')){
    setLocalProfile(curName, {feeds:D.feeds, diapers:D.diapers, weights:D.weights, settings:D.settings});
  }

  // 2. 拉云端
  const all=await cloudFetch();
  if(all===null){
    // 拉不到就用本地缓存
    const loc=getLocalProfile(name);
    if(loc) applyProfile(name, loc);
    else { D.feeds=[];D.diapers=[];D.weights=[];D.settings={name}; }
    render(); return;
  }

  // 3. 合并云端 + 本地
  const merged=mergeProfile(all[name], getLocalProfile(name));
  merged.settings=Object.assign({}, merged.settings, {name});

  // 4. 应用（保留原来的主题偏好，不让换档案把主题重置）
  const keepTheme=S.theme;
  applyProfile(name, merged);
  if(!merged.settings || !merged.settings.theme){
    if(keepTheme){ S.theme=keepTheme; save(); }
  }

  // 5. 把合并结果写回云端（顺便把别的档案也带上）
  all[name]=merged;
  for(const k in localProfiles()){
    if(k!==name && !all[k]) all[k]=localProfiles()[k];
  }
  await cloudPut(all);

  setUrlBaby(name);
  showToast('已切换到「'+name+'」', 2500);
}

function applyProfile(name, p){
  D.feeds=p.feeds||[];
  D.diapers=p.diapers||[];
  D.weights=p.weights||[];
  // 注意：S 是 const 且 D.settings 与 S 同引用，
  // 这里必须「原地改」而不是替换对象，否则 S 会指向旧对象、名字改不掉
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S, p.settings||{}, {name});
  D.settings=S;
  save();
}

/* ================= 分享链接 ================= */
function getUrlBaby(){
  try{
    const q=new URLSearchParams(location.search);
    return (q.get('baby')||'').trim();
  }catch(e){ return ''; }
}

/* 地址栏同步当前档案名（刷新不丢） */
function setUrlBaby(name){
  try{
    const u=new URL(location.href);
    if(name) u.searchParams.set('baby', name);
    else u.searchParams.delete('baby');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  }catch(e){}
}

/* 分享用链接（name 为空 = 不带名字） */
function linkFor(name){
  const base = location.origin + location.pathname;
  return name ? base + '?baby=' + encodeURIComponent(name) : base;
}

/* 轻提示 */
let toastTimer=null;
function showToast(m, ms){
  cloudMsg=m; render();
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ cloudMsg=''; render(); }, ms||2600);
}

/* 复制到剪贴板（含降级方案） */
async function copyText(t){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(t); return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}

/* 分享（withName=true 带宝宝名字） */
async function shareBaby(withName){
  const nm = withName ? babyKey() : '';
  const url = linkFor(nm);
  const title = withName ? (nm+' · 喂奶计时') : '喂奶计时';

  // 优先系统分享面板（手机上好用）
  if(navigator.share){
    try{
      await navigator.share({ title, text: withName ? ('一起记录'+nm+'的喂奶') : '喂奶计时', url });
      showToast('已打开分享');
      return;
    }catch(e){ /* 用户取消或不支持，走复制 */ }
  }
  const ok = await copyText(url);
  if(ok){
    showToast(withName ? ('链接已复制（带「'+nm+'」）') : '空白链接已复制', 2600);
  }else{
    // 复制失败 → 弹只读框，长按手动复制
    openSheet(`<h3>${withName?('分享「'+nm+'」'):'空白链接'}</h3>
      <div class="hint-line" style="text-align:left;padding:0 20px 10px">长按下面的链接，选择「全选 → 拷贝」</div>
      <input type="text" id="shareOut" readonly value="${url}"
        style="width:calc(100% - 40px);margin:0 20px;background:var(--card2);border:1px solid var(--line);
               border-radius:12px;padding:12px;font-size:13px;color:var(--tx)">
      <div class="actions"><button onclick="closeSheet()">关闭</button>
        <button class="pri" onclick="tryCopyAgain('${url.replace(/'/g,"\\'")}')">再试复制</button></div>`);
    setTimeout(()=>{
      const el=document.getElementById('shareOut');
      if(el){ el.focus(); el.select(); }
    },120);
  }
}

async function tryCopyAgain(url){
  const ok=await copyText(url);
  showToast(ok?'已复制':'还是失败，请长按手动复制', 2200);
  if(ok) closeSheet();
}

/* 打开档案切换弹层 */
function openBabySwitch(){
  const names=Object.keys(localProfiles());
  let html=`<h3>宝宝档案</h3>
    <div class="chips">`;
  if(names.length){
    html+=names.map(n=>`<button class="chip${n===babyKey()?' on':''}" onclick="switchBaby('${n.replace(/'/g,"\\'")}');closeSheet()">${n}</button>`).join('');
  }else{
    html+=`<div class="empty-s">还没有档案，在下面新建</div>`;
  }
  html+=`</div>
    <div class="fld" style="border:none;padding-left:0;padding-right:0">
      <div class="k">新建 / 切换到<small>输入名字，自动读取该名字的记录</small></div>
    </div>
    <input type="text" id="babyIn" placeholder="例如：王奕珩" style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px">
    <div class="actions"><button onclick="closeSheet()">取消</button><button class="pri" onclick="doSwitchBaby()">切换</button></div>`;
  openSheet(html);
  setTimeout(()=>document.getElementById('babyIn')?.focus(),80);
}
function doSwitchBaby(){
  const v=(document.getElementById('babyIn')?.value||'').trim();
  if(!v){ alert('请输入名字'); return; }
  closeSheet();
  switchBaby(v);
}

/* 记录变更后自动推云端（防抖） */
let cloudTimer=null;
function pushCloud(){
  if(cloudBusy) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async ()=>{
    cloudBusy=true;
    const all=await cloudFetch();
    if(all!==null){
      const k=babyKey();
      all[k]={feeds:D.feeds, diapers:D.diapers, weights:D.weights, settings:D.settings};
      for(const kk in localProfiles()) if(kk!==k && !all[kk]) all[kk]=localProfiles()[kk];
      const ok=await cloudPut(all);
      if(ok) setLocalProfile(k, all[k]);
    }
    cloudBusy=false;
  }, 2500);
}
function askNotify(){
  if(!('Notification' in window)){ alert('这个浏览器不支持通知'); return; }
  Notification.requestPermission().then(p=>{ fillSettings(); if(p==='granted') notify('喂奶计时','提醒已开启'); });
}
function notify(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  try{ new Notification(title,{body,icon:'icon-180.png',badge:'icon-180.png',tag:'feed'}); }catch(e){}
}
function dl(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ================= 提醒 ================= */
setInterval(()=>{
  accrue();          // 每秒结算，保证时长精确不丢
  render();
  checkNotify();
},1000);

function checkNotify(){
  const gap=S.gapMin||180;
  if(!D.feeds.length) return;
  const since=(Date.now()-D.feeds[0].ts)/60000;
  if(since<gap) return;
  const h=new Date().getHours();
  const q1=S.q1??22, q2=S.q2??6;
  const quiet = q1>q2 ? (h>=q1||h<q2) : (h>=q1&&h<q2);
  if(quiet && since < gap*1.5) return;
  if(Date.now()-lastNotified<60000) return;
  lastNotified=Date.now();
  notify('该喂奶了', `已经 ${Math.round(since/60*10)/10} 小时没喂宝宝了`);
}

/* ================= 启动 ================= */
document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.onclick=()=>{ if(sess) return; mode=b.dataset.m; render(); };
});
document.querySelectorAll('#themeSeg button').forEach(b=>{
  b.onclick=()=>{ setTheme(b.dataset.t); };
});
applyTheme();
render();

/* 启动时：如果本地有档案名，自动拉一次云端（拿到别人刚记的） */
(async function boot(){
  // ① 链接带 ?baby=名字 → 直接用该档案（家人点分享链接走这里）
  const urlBaby=getUrlBaby();
  if(urlBaby){
    if(urlBaby===babyKey() && (D.feeds.length||D.diapers.length)){
      // 已经是这个档案，只后台拉一次云端合并
      await switchBaby(urlBaby);
    }else{
      await switchBaby(urlBaby);
      showToast('已加载「'+urlBaby+'」的记录', 3000);
    }
    return;
  }
  // ② 无参数 → 用上次的档案，从云端拉一次
  const nm=babyKey();
  if(nm && nm!=='宝宝'){
    const all=await cloudFetch();
    if(all && all[nm]){
      const merged=mergeProfile(all[nm], getLocalProfile(nm));
      merged.settings=Object.assign({}, merged.settings, {name:nm});
      applyProfile(nm, merged);
      setLocalProfile(nm, merged);
      render();
    }
    return;
  }
  // ③ 第一次用（没名字也没档案）→ 引导输入
  if(Object.keys(localProfiles()).length===0){
    showToast('先输入宝宝名字，开始记录', 3200);
    setTimeout(()=>openBabySwitch(), 400);
  }
})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
/* 页面回到前台时刷新；并且任何点击都刷新 ——
   iOS 在后台会冻结 JS 定时器，靠定时器驱动会显示旧值。
   时长本身按时间戳实时算（elapsedSec），所以只要 render 跑一次就是准的。 */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ accrue(); render(); } });
window.addEventListener('focus',()=>{ accrue(); render(); });
window.addEventListener('pageshow',()=>{ accrue(); render(); });
document.addEventListener('pointerdown',()=>{ if(sess){ accrue(); render(); } }, {passive:true});
</script>
